<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title id="documentTitle">__APP_NAME__</title>
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="media.css">
<style>
:root {
  color-scheme: dark;
  --bg:#0b1320; --panel:#111d2d; --panel2:#162438; --line:#25364d;
  --text:#edf4ff; --muted:#94a6bd; --accent:#6f8cff; --pink:#f06292;
  --good:#57d38c; --warn:#f4bd63; --danger:#ff6b7d;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif; }
button,input,select { font:inherit; }
button { border:1px solid var(--line); background:#1a2b42; color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; }
button:hover { background:#243a56; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.ghost { background:transparent; }
button:disabled { opacity:.62; cursor:default; }
.play-button { min-width:108px; }
.spinner { display:inline-block; width:13px; height:13px; margin-right:7px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; vertical-align:-2px; animation:spin .75s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#refreshAll { display:flex; align-items:center; justify-content:center; gap:7px; }
#app { display:grid; grid-template-columns:220px 1fr; height:100%; }
.sidebar { background:#0f1a29; border-right:1px solid var(--line); padding:18px 16px 22px; display:flex; flex-direction:column; min-width:220px; }
.logo { display:flex; align-items:center; gap:10px; font-size:22px; font-weight:800; letter-spacing:-.4px; white-space:nowrap; padding:0 8px 18px; overflow:visible; }
.logo img { width:43px; height:43px; object-fit:contain; filter:drop-shadow(0 0 9px rgba(118,219,255,.35)); }
.nav { display:flex; flex-direction:column; gap:5px; }
.nav button { border:0; text-align:left; background:transparent; padding:10px 12px; }
.nav button.active { background:#1b2d45; color:white; }
.sidebar-bottom { margin-top:auto; display:grid; gap:8px; }
.status { display:none; }
.title-tooltip { position:fixed; z-index:10020; max-width:min(440px,calc(100vw - 24px)); padding:8px 10px; border:1px solid #405675; border-radius:8px; background:rgba(5,12,22,.97); color:#fff; font-size:12px; line-height:1.35; box-shadow:0 8px 28px rgba(0,0,0,.42); pointer-events:none; opacity:0; transform:translateY(3px); transition:opacity .09s ease,transform .09s ease; overflow-wrap:anywhere; }
.title-tooltip.show { opacity:1; transform:none; }
.relation-preview { position:fixed; z-index:10025; width:min(270px,calc(100vw - 24px)); display:grid; grid-template-columns:82px minmax(0,1fr); gap:11px; align-items:start; padding:10px; border:1px solid #506986; border-radius:11px; background:rgba(5,12,22,.98); color:#fff; box-shadow:0 12px 38px rgba(0,0,0,.52); pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .1s ease,transform .1s ease; }
.relation-preview.show { opacity:1; transform:none; }
.relation-preview-cover { width:82px; height:116px; border-radius:7px; object-fit:cover; background:#20334f; }
.relation-preview-cover.placeholder { display:grid; place-items:center; color:var(--muted); font-size:10px; }
.relation-preview-copy { min-width:0; padding-top:2px; }
.relation-preview-title { font-size:14px; font-weight:800; line-height:1.28; overflow-wrap:anywhere; }
.relation-preview-meta { display:grid; gap:5px; margin-top:10px; color:#c7d5e8; font-size:12px; }
.main { min-width:0; height:100%; overflow:hidden; display:flex; flex-direction:column; }
.toolbar { flex:0 0 auto; display:flex; align-items:center; gap:12px; padding:18px 24px 12px; border-bottom:1px solid rgba(37,54,77,.45); }
.toolbar h1 { font-size:25px; margin:0; }
.toolbar .count { color:var(--muted); }
.toolbar .spacer { flex:1; }
.page-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:20px 24px 40px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.page { display:none; }
.page.active { display:block; }
.section-title { font-size:18px; font-weight:700; margin:0 0 12px; }
.ready-sections { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(560px,100%),1fr)); gap:0 24px; align-items:start; }
.home-section { min-width:0; }
.ready-sections .airing-grid { grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); }
.airing-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:12px; margin-bottom:28px; }
.airing-card { position:relative; display:flex; flex-direction:column; min-width:0; border:2px solid var(--accent); border-radius:9px; overflow:hidden; background:var(--panel2); cursor:pointer; box-shadow:0 3px 14px rgba(0,0,0,.2); }
.airing-card.outdated { border-color:var(--pink); }
.downloaded-card { border-color:var(--good); }
.waiting-card { border-color:var(--warn); cursor:pointer; }
.download-available-card { border-color:#8e7dff; cursor:default; }
.download-available-card .cover-action { display:block; width:100%; max-width:none; }
.download-available-card .airing-meta { height:68px; min-height:68px; }
.download-card-button { margin-top:auto; width:100%; padding:5px 7px; font-size:9px; line-height:1.1; }
.download-card-state { margin-top:auto!important; font-size:9px!important; color:#c9c0ff!important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.caught-up-card { border-color:var(--accent); cursor:pointer; }
.dropped-card { border-color:var(--danger); cursor:pointer; opacity:.9; }
.airing-card.play-starting,.airing-card.play-running { pointer-events:none; }
.airing-card.play-starting::after,.airing-card.play-running::after { position:absolute; inset:0; display:grid; place-items:center; background:rgba(4,10,18,.72); color:white; font-weight:750; z-index:6; text-align:center; padding:8px; }
.airing-card.play-starting::after { content:attr(data-starting-label); }
.airing-card.play-running::after { content:attr(data-running-label); }
.airing-cover-shell { width:100%; aspect-ratio:104/146; border-radius:0; }
.airing-card img,.cover-placeholder { width:100%; height:100%; display:block; object-fit:cover; background:#20334f; }
.cover-placeholder { display:grid; place-items:center; color:var(--muted); }
.airing-meta { flex:1; height:68px; min-height:68px; display:flex; flex-direction:column; text-align:center; padding:5px 4px 7px; background:rgba(24,38,58,.96); overflow:hidden; }
.airing-meta strong { display:-webkit-box; min-height:29px; font-size:12px; line-height:1.2; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
.airing-meta span { display:block; font-size:11px; color:#dbe7ff; margin-top:2px; }
.airing-state { margin-top:auto!important; max-width:100%; font-size:9px!important; color:var(--good)!important; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.resume-progress { height:3px; margin-top:6px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.12); }
.resume-progress span { display:block; height:100%; margin:0; background:var(--accent); }
.airing-card.outdated .airing-state { color:#ffb5c8!important; }
.ready-sequence-card { position:relative; min-width:0; display:flex; flex-direction:column; overflow:hidden; border:2px solid rgba(87,211,140,.72); border-radius:9px; background:var(--panel2); box-shadow:0 3px 14px rgba(0,0,0,.2); cursor:pointer; }
.ready-sequence-cover { position:relative; width:100%; aspect-ratio:104/146; overflow:hidden; background:#20334f; }
.ready-sequence-cover img { width:100%; height:100%; display:block; object-fit:cover; }
.ready-sequence-count-wrap { position:absolute; z-index:8; right:6px; top:6px; }
.ready-sequence-count { min-width:34px; height:24px; display:grid; place-items:center; padding:0 6px; border-radius:999px; background:rgba(5,12,22,.88); border:1px solid rgba(255,255,255,.38); color:#fff; font-size:10px; font-weight:850; cursor:help; }
.ready-sequence-switch { position:absolute; z-index:6; top:50%; width:28px; height:38px; display:grid; place-items:center; padding:0; border:1px solid rgba(255,255,255,.34); border-radius:8px; background:rgba(4,10,18,.78); color:#fff; font-size:24px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.35); transform:translateY(-50%); }
.ready-sequence-switch:hover { background:rgba(35,62,94,.94); transform:translateY(-50%); }
.ready-sequence-switch.previous { left:6px; }
.ready-sequence-switch.next { right:6px; }
.ready-sequence-cover-media { position:absolute; inset:0; }
.ready-sequence-cover-media img,.ready-sequence-cover-media .cover-placeholder { width:100%; height:100%; }
.ready-sequence-meta { height:68px; min-height:68px; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:6px 5px 7px; text-align:center; background:rgba(24,38,58,.96); overflow:hidden; }
.ready-sequence-meta strong { display:-webkit-box; min-height:29px; font-size:12px; line-height:1.2; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
.ready-sequence-meta span { font-size:9px; color:var(--good); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ready-sequence-list { position:absolute; z-index:7; inset:6px; max-height:calc(100% - 12px); display:flex; flex-direction:column; gap:4px; padding:36px 7px 7px; overflow:auto; background:rgba(4,10,18,.96); border:1px solid rgba(255,255,255,.24); border-radius:9px; opacity:0; pointer-events:none; transition:opacity .12s ease; }
.ready-sequence-count-wrap:hover + .ready-sequence-list,.ready-sequence-count-wrap:focus-within + .ready-sequence-list,.ready-sequence-list:hover,.ready-sequence-list:focus-within { opacity:1; pointer-events:auto; }
.ready-sequence-row { width:100%; display:grid; grid-template-columns:22px minmax(0,1fr); align-items:center; gap:6px; padding:6px; border:1px solid #365477; border-radius:6px; background:rgba(24,38,58,.96); color:#eef4ff; text-align:left; box-shadow:none; }
.ready-sequence-row:hover { background:#29486e; transform:none; }
.ready-sequence-row.active { border-color:var(--good); background:#29486e; }
.ready-sequence-row-number { width:20px; height:20px; display:grid; place-items:center; border-radius:999px; background:rgba(87,211,140,.18); color:#dff9eb; font-size:9px; font-weight:850; }
.ready-sequence-row-title { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10px; }
.hover-title { position:absolute; inset:auto 0 54px 0; background:rgba(4,10,18,.9); color:#fff; padding:8px 6px; font-size:11px; line-height:1.25; text-align:center; opacity:0; transform:translateY(4px); transition:opacity .12s ease,transform .12s ease; pointer-events:none; z-index:5; }
.airing-card:hover .hover-title { opacity:1; transform:none; }
.card-list { display:grid; gap:10px; }
.anime-card { display:grid; grid-template-columns:7px 90px minmax(0,1fr) auto; gap:13px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px; align-items:start; content-visibility:auto; contain-intrinsic-size:140px; }
.anime-card .stripe { width:7px; height:100%; min-height:118px; border-radius:5px; background:transparent; }
.anime-card.outdated .stripe { background:var(--pink); }
.list-cover-shell { width:90px; height:126px; border-radius:6px; }
.anime-card img,.list-cover-placeholder { width:100%; height:100%; object-fit:cover; border-radius:inherit; background:#20334f; }
.cover-action { display:block; width:max-content; cursor:pointer; padding:0; border:0; border-radius:6px; background:transparent; box-shadow:none; }
.cover-action:hover { background:transparent; transform:none; box-shadow:0 0 0 2px rgba(111,140,255,.45); }
.list-cover-placeholder { display:grid; place-items:center; color:var(--muted); font-size:11px; }
.anime-title { font-size:16px; font-weight:750; margin:1px 0 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.anime-copy { min-height:126px; display:flex; flex-direction:column; }
.anime-status { margin-top:auto; padding-top:8px; }
.meta,.subtle { color:var(--muted); line-height:1.55; }
.good { color:var(--good); } .warning { color:var(--warn); } .danger { color:var(--pink); }
.card-actions { display:grid; gap:6px; min-width:118px; }

.anime-card.planned-with-relations { grid-template-columns:7px 90px minmax(210px,1fr) minmax(540px,58%); align-items:center; }
.relation-diagram { min-width:0; display:flex; align-items:stretch; justify-content:flex-end; gap:5px; padding:3px 0 3px 8px; overflow-x:auto; scrollbar-width:thin; }
.relation-stage { flex:0 0 104px; min-width:104px; display:flex; flex-direction:column; justify-content:center; gap:5px; }
.relation-stage.current-stage { flex-basis:112px; min-width:112px; }
.relation-stage-label { color:var(--muted); font-size:8px; font-weight:800; letter-spacing:.06em; text-align:center; text-transform:uppercase; white-space:nowrap; }
.relation-node { width:100%; min-width:0; min-height:55px; display:grid; grid-template-columns:34px minmax(0,1fr); gap:6px; align-items:center; padding:4px; border:1px solid #38506f; border-radius:8px; background:#142338; color:var(--text); text-align:left; box-shadow:none; cursor:default; }
.relation-node:hover { background:#1c304a; border-color:#5877a0; }
.relation-node.current { border-color:var(--accent); background:linear-gradient(145deg,rgba(111,140,255,.25),rgba(22,36,56,.98)); }
.relation-node.watched { border:2px solid var(--good)!important; padding:3px; box-shadow:0 0 0 1px rgba(94,218,153,.22),0 0 12px rgba(94,218,153,.12); }
.relation-cover-action { width:34px; height:48px; display:block; padding:0; border:0; border-radius:5px; background:transparent; box-shadow:none; overflow:hidden; }
.relation-cover-action:hover { background:transparent; transform:none; box-shadow:0 0 0 2px rgba(111,140,255,.58); }
.relation-node-cover { width:34px; height:48px; display:block; border-radius:5px; object-fit:cover; background:#20334f; }
.relation-node-cover.placeholder { display:grid; place-items:center; color:var(--muted); font-size:8px; }
.relation-node-copy { min-width:0; }
.relation-node-title { display:-webkit-box; min-width:0; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; font-size:9px; font-weight:750; line-height:1.18; }
.relation-node-meta { display:block; margin-top:3px; color:var(--muted); font-size:8px; line-height:1.1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.relation-arrow { flex:0 0 18px; position:relative; align-self:stretch; display:grid; place-items:center; color:#7189a8; font-size:14px; }
.relation-arrow::before { content:""; position:absolute; left:1px; right:1px; top:50%; border-top:1px solid #425a78; }
.relation-arrow span { position:relative; z-index:1; padding-left:1px; background:var(--panel); }
@media (max-width:1320px) {
  .anime-card.planned-with-relations { grid-template-columns:7px 90px minmax(0,1fr); align-items:start; }
  .anime-card.planned-with-relations .relation-diagram { grid-column:3; grid-row:2; width:100%; justify-content:flex-start; padding:8px 0 1px; }
}
.filters { display:flex; align-items:center; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
.filters select,.filters input { background:#14243a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.filters input[type=search] { min-width:220px; flex:1 1 260px; }
.filters input[type=search]:focus { outline:2px solid rgba(75,151,255,.55); outline-offset:1px; }
.table-wrap { overflow:auto; border:1px solid var(--line); border-radius:10px; }
.release-list { display:grid; gap:8px; }
.release-row { display:grid; grid-template-columns:54px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 10px; border:1px solid var(--line); border-radius:9px; background:#132238; }
.release-score { display:grid; justify-items:center; line-height:1; }
.release-score strong { font-size:15px; }
.release-score span { margin-top:4px; color:var(--muted); font-size:8px; text-transform:uppercase; }
.release-main { min-width:0; }
.release-main strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; }
.release-main span { display:block; margin-top:4px; color:var(--muted); font-size:9px; line-height:1.25; white-space:normal; overflow-wrap:anywhere; }
.release-download-button { min-width:92px; white-space:nowrap; }
@media (max-width:720px) { .release-row { grid-template-columns:44px minmax(0,1fr); } .release-download-button { grid-column:1 / -1; width:100%; } }
table { width:100%; border-collapse:collapse; }
th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
th { position:sticky; top:0; background:#15253a; z-index:2; }
td.path { max-width:560px; overflow:hidden; text-overflow:ellipsis; }
.settings { width:100%; max-width:none; display:grid; gap:20px; }
.settings-section { background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:16px; }
.settings-section h2 { margin:0 0 14px; font-size:17px; }
.form-grid { display:grid; grid-template-columns:minmax(190px,28%) minmax(0,1fr); gap:10px 14px; align-items:center; width:100%; }
.form-grid label { color:#cad7e8; }
.form-grid input,.form-grid select,.form-grid textarea { width:100%; background:#0f1b2a; color:var(--text); border:1px solid #334862; border-radius:7px; padding:9px 10px; outline:none; user-select:text; -webkit-user-select:text; }
.shortcut-recorder { width:100%; min-height:38px; display:flex; align-items:center; justify-content:flex-start; gap:7px; background:#0f1b2a; color:var(--text); border:1px solid #334862; border-radius:7px; padding:8px 10px; box-shadow:none; text-align:left; }
.shortcut-recorder:hover { background:#14243a; transform:none; }
.shortcut-recorder.recording { border-color:var(--accent); box-shadow:0 0 0 2px rgba(111,140,255,.16); }
.shortcut-recorder.empty { color:var(--muted); }
.shortcut-keycap { min-width:23px; height:23px; display:inline-grid; place-items:center; padding:0 6px; border:1px solid #516a88; border-bottom-width:2px; border-radius:6px; background:#192a40; color:#f3f7ff; font:700 13px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
.shortcut-recording-label { color:var(--muted); font-size:12px; }
.form-grid input:focus,.form-grid select:focus,.form-grid textarea:focus { border-color:var(--accent); box-shadow:0 0 0 2px rgba(111,140,255,.18); }
.form-grid textarea { min-height:72px; resize:vertical; font:inherit; }
.check { display:flex; align-items:center; gap:9px; }
.check input { width:auto; }
.form-actions { display:flex; justify-content:flex-end; gap:9px; position:sticky; bottom:-20px; padding:12px 0 0; background:transparent; }

.settings-flat { width:100%; max-width:none; display:grid; gap:14px; }
.settings-panel { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:11px; overflow:hidden; }
.settings-header { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:16px; border-bottom:1px solid var(--line); }
.settings-header h2 { margin:0 0 5px; font-size:18px; }
.setting-block { padding:15px 16px; border-bottom:1px solid rgba(37,54,77,.82); }
.setting-block:last-child { border-bottom:0; }
.setting-block > h3 { margin:0 0 6px; font-size:15px; }
.setting-block > p { margin:0 0 12px; }
.setting-toggle { display:flex; align-items:center; gap:10px; min-height:30px; font-weight:700; color:#dfe9f8; }
.setting-toggle input { width:auto; margin:0; }
.conditional-settings { display:grid; gap:10px; margin-top:12px; padding:12px 0 0 24px; border-left:2px solid #2a405d; }
.conditional-settings.hidden { display:none; }
.setting-subgroup { margin-top:12px; padding-top:12px; border-top:1px solid rgba(75,96,124,.45); }
.setting-inline-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
.setting-divider-title { color:var(--muted); font-size:12px; font-weight:750; text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px; }
.library-toolbar { display:flex; align-items:center; gap:10px; margin:0 0 12px; }
.library-toolbar select { background:#14243a; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.library-grid { display:grid; gap:10px; }
.library-card { display:grid; cursor:pointer; grid-template-columns:72px minmax(0,1fr); gap:13px; padding:11px; background:var(--panel); border:1px solid var(--line); border-radius:10px; content-visibility:auto; contain-intrinsic-size:120px; }
.library-cover-shell { width:72px; height:102px; border-radius:6px; overflow:hidden; }
.library-cover-shell img,.library-cover-placeholder { width:100%; height:100%; object-fit:cover; background:#20334f; }
.library-cover-placeholder { display:grid; place-items:center; color:var(--muted); font-size:10px; }
.library-main { min-width:0; }
.library-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
.library-head h3 { margin:1px 0 5px; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.library-badges { display:flex; flex-wrap:wrap; gap:6px; margin:7px 0; }
.library-badge { border:1px solid #334862; border-radius:999px; padding:3px 8px; color:#cad7e8; font-size:11px; }
.library-badge.good { border-color:rgba(87,211,140,.45); }
.library-badge.warning { border-color:rgba(244,189,99,.5); }
.library-details { margin-top:8px; }
.library-details summary { cursor:pointer; color:#dbe7ff; user-select:none; width:max-content; max-width:100%; }
.library-episodes { display:grid; gap:6px; margin-top:9px; }
.library-episode { display:grid; grid-template-columns:var(--episode-column-width,68px) 95px 95px minmax(0,1fr) auto; gap:8px; align-items:center; padding:7px 8px; background:#0e1928; border:1px solid #22354d; border-radius:7px; }
.library-episode > strong { white-space:nowrap; }
.library-episode-name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#c9d6e7; }
.library-state { font-size:11px; color:var(--muted); }
.library-state.ready,.library-state.watched { color:var(--good); }

@keyframes polychrome-flow {
  0% { background-position:0% 20%,0 0,0 0,0 0; filter:hue-rotate(0deg) saturate(1.65) brightness(1.1); }
  50% { background-position:100% 80%,40px 30px,-28px 42px,70px -30px; filter:hue-rotate(160deg) saturate(2.05) brightness(1.18); }
  100% { background-position:0% 20%,80px 60px,-56px 84px,140px -60px; filter:hue-rotate(360deg) saturate(1.65) brightness(1.1); }
}
@keyframes polychrome-glint {
  0%,18% { transform:translateX(-190%) skewX(-18deg); opacity:0; }
  31% { opacity:1; }
  58%,100% { transform:translateX(285%) skewX(-18deg); opacity:0; }
}
/* Keep the foil look while idle, but do not keep WKWebView/GPU awake forever.
   The expensive motion is a short one-shot when Watching becomes active or
   when the user deliberately hovers a polychrome cover. */
.cover-shell { position:relative; overflow:hidden; background:#20334f; isolation:isolate; }
.cover-shell.polychrome { box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(91,216,255,.5),0 0 34px rgba(255,84,208,.24); }
.cover-shell.polychrome::before {
  content:""; position:absolute; inset:-22%; z-index:2; pointer-events:none;
  background:
    conic-gradient(from 20deg at 48% 42%,rgba(255,53,197,.4),rgba(63,226,255,.75),rgba(255,228,56,.68),rgba(132,73,255,.78),rgba(255,53,197,.4)),
    repeating-linear-gradient(117deg,rgba(255,255,255,.34) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(23deg,rgba(54,225,255,.32) 0 2px,rgba(255,58,200,.27) 2px 5px,transparent 5px 11px),
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 28%);
  background-size:190% 190%,40px 30px,56px 42px,120px 120px;
  background-position:0% 20%,0 0,0 0,0 0;
  filter:hue-rotate(0deg) saturate(1.65) brightness(1.1);
  mix-blend-mode:color-dodge;
  opacity:.9;
  animation:none;
}
.cover-shell.polychrome::after {
  content:""; position:absolute; z-index:3; top:-35%; bottom:-35%; left:-60%; width:48%; pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,rgba(97,238,255,.24) 20%,rgba(255,255,255,.98) 48%,rgba(255,87,219,.34) 70%,transparent 100%);
  mix-blend-mode:screen;
  transform:translateX(-190%) skewX(-18deg);
  opacity:0;
  animation:none;
}
.cover-shell.polychrome img { filter:contrast(1.1) saturate(1.28) brightness(1.05); }
.cover-shell.polychrome.polychrome-wake::before,
.cover-shell.polychrome.polychrome-hover-wake::before { animation:polychrome-flow 1.875s ease-out 1 both; }
.cover-shell.polychrome.polychrome-wake::after,
.cover-shell.polychrome.polychrome-hover-wake::after { animation:polychrome-glint 1.425s ease-out 1 both; }
/* Preserve the current foil frame, but stop every CSS animation while the
   macOS window is not active. This lets WKWebView/GPU enter an idle state. */
html.ui-inactive *,
html.ui-inactive *::before,
html.ui-inactive *::after { animation-play-state:paused !important; }

<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><img src="app-logo.png" alt=""><span id="appBrandName">__APP_NAME__</span></div>
    <nav class="nav">
      <button data-page="current" class="active" data-i18n="nav.current">Anime</button>
      <button data-page="lightnovels" data-i18n="nav.lightnovels">Light Novels</button>
      <button data-page="manga" data-i18n="nav.manga">Manga</button>
      <button data-page="audiobooks" data-i18n="nav.audiobooks">Audiobooks</button>
      <button data-page="planned" data-i18n="nav.planned">Planning</button>
      <button data-page="settings" data-i18n="nav.settings">Settings</button>
    </nav>
    <div class="sidebar-bottom">
      <button id="refreshAll" data-i18n="action.refresh">Refresh</button>
      <button id="openFolder" data-i18n="action.openFolder">Open folder</button>
      <div id="status" class="status" hidden aria-live="polite"></div>
    </div>
  </aside>
  <main class="main">
    <div class="toolbar">
      <h1 id="pageTitle">Anime</h1><span id="pageCount" class="count"></span><span class="spacer"></span>
    </div>
    <div id="scroll" class="page-scroll">
      <div id="startupBanner" class="startup-banner"><span class="spinner"></span><span id="startupBannerText"></span></div>
      <section id="current" class="page active"><div id="currentContent"></div></section>
      <section id="planned" class="page">
        <div class="filters">
          <input id="plannedSearch" type="search" autocomplete="off" spellcheck="false" aria-label="Search Planning">
          <span data-i18n="planned.show">Show:</span>
          <select id="plannedFilter"><option value="all" data-i18n="planned.all">All</option><option value="unfinished" data-i18n="planned.unfinished">Unfinished only</option><option value="finished" data-i18n="planned.finished">Finished only</option></select>
          <span data-i18n="planned.type">Type:</span>
          <select id="plannedTypeFilter"><option value="all" data-i18n="planned.typeAll">All</option><option value="anime" data-i18n="planned.typeAnime">Anime</option><option value="manga" data-i18n="planned.typeManga">Manga</option><option value="novel" data-i18n="planned.typeNovel">Light Novels</option></select>
          <span data-i18n="planned.sort">Sort:</span>
          <select id="plannedSort"><option value="title" data-i18n="planned.byTitle">By title</option><option value="episodes" data-i18n="planned.byEpisodes">By episode count</option><option value="rating" data-i18n="planned.byRating">By rating</option></select>
        </div>
        <div id="plannedContent" class="card-list"></div>
      </section>
      <section id="lightnovels" class="page"><div id="lightNovelsContent"></div></section>
      <section id="manga" class="page"><div id="mangaContent"></div></section>
      <section id="audiobooks" class="page"><div id="audiobooksContent"></div></section>
      <section id="diagnostics" class="page">
        <div class="settings">
          <section class="settings-section">
            <h2 data-i18n="section.diagnostics">Diagnostics and timings</h2>
            <p class="subtle" data-i18n="help.diagnostics">Each operation writes START, DONE or FAIL together with duration_ms. This makes slow Nyaa, qBittorrent, subtitle and AniList stages visible.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
              <button id="refreshLogs" data-i18n="action.refreshLogs">Refresh logs</button>
              <button id="openLogs" data-i18n="action.openLogs">Open log folder</button>
            </div>
            <div id="logPath" class="subtle" style="margin-top:10px"></div>
            <pre id="logOutput" class="log-output"></pre>
          </section>
        </div>
      </section>
      <section id="settings" class="page"><div id="settingsContent"></div></section>
    </div>
  </main>
</div>

umi OLED</option><option value="ai">Indigo</option><option value="moss">Moss</option><option value="contrast">High contrast</option><option value="custom">Custom</option></select><label for="lnrTextColor" data-i18n="settings.lnTextColor">Text color</label><input id="lnrTextColor" type="color"><label for="lnrBgColor" data-i18n="settings.lnBackgroundColor">Background color</label><input id="lnrBgColor" type="color"><label for="lnrWidth" data-i18n="settings.lnWidth">Text width, px</label><input id="lnrWidth" type="number" min="360" max="2400"><label for="lnrLineHeight" data-i18n="settings.lnLineHeight">Line height</label><input id="lnrLineHeight" type="number" min="1" max="3.5" step="0.1"><label for="lnrIndent" data-i18n="settings.lnIndent">Paragraph indent, em</label><input id="lnrIndent" type="number" min="0" max="5" step="0.1"><span></span><label class="check"><input id="lnrVertical" type="checkbox"><span data-i18n="settings.lnVertical">Vertical Japanese text</span></label><label for="lnrMode" data-i18n="settings.lnReaderMode">Reading mode</label><select id="lnrMode"><option value="scroll" data-i18n="settings.lnScroll">Continuous scroll</option><option value="pages" data-i18n="settings.lnPages">Pages / columns</option></select><span></span><label class="check"><input id="lnrFurigana" type="checkbox"><span data-i18n="settings.lnFurigana">Show furigana</span></label><label for="lnrCustomCss" data-i18n="settings.lnCustomCss">Custom reader CSS</label><textarea id="lnrCustomCss" spellcheck="false" placeholder=".ln-reader .state-due { color:#ff6b7d; }"></textarea></div></div><div id="lnReaderScroll" class="ln-reader-scroll"><article id="lnReader" class="ln-reader"></article></div></div><div id="lnStudyPop" class="ln-study-pop"></div><div id="lnTranslatePop" class="ln-translate-pop"></div><style id="lnCustomStyle"></style>

function formatEpisodeRanges(values){
  const episodes=[...new Set((values||[]).filter(value=>Number.isInteger(value)).map(Number))].sort((a,b)=>a-b);

    const value=episodes[i];
    if(value===end+1){end=value;continue;}
    ranges.push(start===end?String(start):`${start}-${end}`);
    start=end=value;
  }
  ranges.push(start===end?String(start):`${start}-${end}`);
  return ranges.join(',');
}

  let delaySeconds=Math.max(20,Math.min(60,etaSeconds*.5));

const SCORE_WHEEL_WEIGHTS=[1,2,4,7,10,10,7,4,2,1];
const SCORE_WHEEL_TOTAL=SCORE_WHEEL_WEIGHTS.reduce((sum,value)=>sum+value,0);
function scoreWheelSegments(){
  let offset=0;const segments=[];
  for(let score=1;score<=10;score++){
    const weight=SCORE_WHEEL_WEIGHTS[score-1],start=offset/SCORE_WHEEL_TOTAL*360;
    offset+=weight;const end=offset/SCORE_WHEEL_TOTAL*360;
    segments.push({score,start,end,center:(start+end)/2});
  }
  return segments;
}
function scoreWheelGradient(){
  const colors=['#a93c4a','#c64e42','#d66d37','#db9235','#d2b63c','#aebe48','#78b85b','#4cac78','#439eb0','#6f8cff'];
  return `conic-gradient(${scoreWheelSegments().map((segment,index)=>`${colors[index]} ${segment.start}deg ${segment.end}deg`).join(',')})`;
}
function chooseWheelResult(previous=null){
  let pick=Math.random()*SCORE_WHEEL_TOTAL,score=1;
  for(let index=0;index<SCORE_WHEEL_WEIGHTS.length;index++){pick-=SCORE_WHEEL_WEIGHTS[index];if(pick<0){score=index+1;break;}}
  if(previous!=null&&score===previous){return chooseWheelResult(previous);}
  const segment=scoreWheelSegments()[score-1];
  const target=segment.start+Math.random()*(segment.end-segment.start);
  return {score,target};
}

function graphWithoutRelated(graph,rootId=null){
  const nodes=(graph?.nodes||[]).filter(item=>item&&item.media_id!=null);
  const byId=new Map(nodes.map(item=>[Number(item.media_id),item]));
  const edges=(graph?.edges||[]).map(edge=>({...edge,source:Number(edge.source),target:Number(edge.target),relation_type:String(edge.relation_type||'OTHER').toUpperCase()})).filter(edge=>byId.has(edge.source)&&byId.has(edge.target)&&edge.source!==edge.target&&!['CHARACTER','SHARED_CHARACTERS','RELATED','OTHER'].includes(edge.relation_type));
  const root=Number(rootId??graph?.root_id);
  if(!byId.has(root))return {...graph,nodes,edges};
  const adjacency=new Map(nodes.map(item=>[Number(item.media_id),[]]));
  for(const edge of edges){adjacency.get(edge.source)?.push(edge.target);adjacency.get(edge.target)?.push(edge.source);}
  const visible=new Set([root]),queue=[root];
  while(queue.length){const current=queue.shift();for(const next of adjacency.get(current)||[]){if(visible.has(next))continue;visible.add(next);queue.push(next);}}
  return {...graph,nodes:nodes.filter(item=>visible.has(Number(item.media_id))),edges:edges.filter(edge=>visible.has(edge.source)&&visible.has(edge.target))};
}

function cacheRelationGraph(graph){
  const clean=graphWithoutRelated(graph,graph?.root_id);
  const nodes=(clean?.nodes||[]).filter(item=>item&&item.media_id!=null);
  if(!nodes.length)return;
  const graphId=String(clean.graph_id||`component-${Math.min(...nodes.map(item=>Number(item.media_id)))}`);
  const cache=ui.relationGraphCache||(ui.relationGraphCache={graphs:{},mediaToGraph:{}});
  const staleIds=new Set(nodes.map(item=>cache.mediaToGraph?.[String(Number(item.media_id))]).filter(Boolean));
  for(const staleId of staleIds)if(staleId!==graphId)delete cache.graphs[staleId];
  const stored={...clean};delete stored.root_id;delete stored.refreshed_at;delete stored.next_refresh_at;delete stored.graph_id;
  cache.graphs[graphId]={graph:stored,refreshed_at:Number(clean.refreshed_at||0),next_refresh_at:Number(clean.next_refresh_at||0)};
  for(const node of nodes)cache.mediaToGraph[String(Number(node.media_id))]=graphId;

    const contentY=(viewport.scrollTop+(py-rect.top))/scale;
    scale=nextScale;
    canvas.style.transform=`scale(${scale})`;
    canvas.style.marginRight=`${Math.max(0,Number(viewport.dataset.graphWidth||canvas.offsetWidth)*(scale-1))}px`;
    canvas.style.marginBottom=`${Math.max(0,Number(viewport.dataset.graphHeight||canvas.offsetHeight)*(scale-1))}px`;
    viewport.scrollLeft=contentX*scale-(px-rect.left);
    viewport.scrollTop=contentY*scale-(py-rect.top);
    if(zoomValue)zoomValue.textContent=`${Math.round(scale*100)}%`;
  };
  viewport.addEventListener('wheel',event=>{
    if(!(event.ctrlKey||event.metaKey||event.altKey))return;
    event.preventDefault();
    apply(scale*Math.exp(-event.deltaY*.0025),event.clientX,event.clientY);
  },{passive:false});
  viewport.addEventListener('pointerdown',event=>{
    if(event.button!==0||event.target.closest('button,a,.relation-node'))return;
    dragging=true;startX=event.clientX;startY=event.clientY;startLeft=viewport.scrollLeft;startTop=viewport.scrollTop;
    viewport.classList.add('dragging');viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener('pointermove',event=>{if(dragging){viewport.scrollLeft=startLeft-(event.clientX-startX);viewport.scrollTop=startTop-(event.clientY-startY);}});
  const stop=event=>{if(!dragging)return;dragging=false;viewport.classList.remove('dragging');try{viewport.releasePointerCapture(event.pointerId);}catch(_){}};
  viewport.addEventListener('pointerup',stop);viewport.addEventListener('pointercancel',stop);
  root.querySelectorAll('[data-relation-zoom]').forEach(button=>button.addEventListener('click',()=>{
    const action=button.dataset.relationZoom;
    if(action==='in')apply(scale*1.2);else if(action==='out')apply(scale/1.2);else apply(1);
  }));
  apply(1);
}

async function openWatchOrder(mediaId){
  const a=animeFromId(mediaId);if(!a)return;
  clearRelationLoadingTimer();
  ui.ratingContext=null;ui.releaseContext=null;
  const cached=cachedRelationGraph(a.media_id);
  const context={mediaId:Number(a.media_id),title:a.title||'',loading:!cached,showLoading:false,loadingTimer:null,graph:cached,error:''};
  ui.relationContext=context;

  if(cached){
    const startedAt=performance.now();
    logUiEvent('watch_order.open',{media_id:context.mediaId,cached:true,nodes:(cached.nodes||[]).length});
    await prepareCachedWatchOrderFirstFrame(context,startedAt);
    return;
  }

  context.loadingTimer=setTimeout(()=>{
    if(ui.relationContext!==context||!context.loading)return;
    context.showLoading=true;
    renderOpenWatchOrder();
    showWatchOrderModal();
  },200);
  try{
    const graph=await pywebview.api.get_relation_graph(Number(a.media_id));
    if(ui.relationContext!==context)return;
    clearRelationLoadingTimer(context);
    cacheRelationGraph(graph);
    context.graph=cachedRelationGraph(a.media_id)||graph;context.loading=false;
    if(hydrateAllCompactRelationsFromGraph(context.graph))renderDataPages();
    renderOpenWatchOrder();
    showWatchOrderModal();

  }
}

  if(e.target.id==='onboardingChooseSubtitleFolder'){captureOnboardingStep();const r=await pywebview.api.choose_subtitle_folder();if(r?.path){ui.onboardingDraft.subtitle_folder_enabled=true;ui.onboardingDraft.subtitle_folder=r.path;renderOnboarding();}if(r?.path&&!r.access)toast(t('toast.folderAccessDenied'));}
  if(e.target.id==='checkReleaseUpgrades'){e.target.disabled=true;try{const r=await pywebview.api.check_release_upgrades();ui.state=r.state;renderDataPages();setPage('settings');toast(t('toast.releaseUpgradeChecked',{count:r.scheduled||0}));}catch(err){toast(t('error.generic',{error:err.message||err}));}}
  if(e.target.id==='checkSubtitleUpgrades'){e.target.disabled=true;try{const r=await pywebview.api.check_subtitle_upgrades();ui.state=r.state;renderDataPages();setPage('settings');toast(t('toast.subtitleUpgradeChecked',{count:r.scheduled||0}));if((r.scheduled||0)>0&&!ui.foregroundPollTimer)ui.foregroundPollTimer=setTimeout(pollForegroundWork,500);}catch(err){toast(t('error.generic',{error:err.message||err}));}}
  if(e.target.id==='createBackup'){e.target.disabled=true;try{const r=await pywebview.api.create_full_backup();toast(t('toast.backupCreated',{path:r.path||''}));}catch(err){toast(t('error.generic',{error:err.message||err}));}finally{const b=$('createBackup');if(b)b.disabled=false;}}
  if(e.target.id==='restoreBackup'){if(!confirm(t('confirm.restoreBackup')))return;e.target.disabled=true;try{const r=await pywebview.api.restore_full_backup();if(r?.cancelled)return;if(!r?.ok)throw new Error(r?.error||'Restore failed');ui.state=r.state;renderAll();setPage('settings');toast(t('toast.backupRestored'));}catch(err){toast(t('error.generic',{error:err.message||err}));}finally{const b=$('restoreBackup');if(b)b.disabled=false;}}
  if(e.target.id==='runSetupGuide')showOnboarding(true);
  if(e.target.id==='onboardingSkip')await skipOnboarding();
  if(e.target.id==='onboardingBack'){captureOnboardingStep();ui.onboardingStep=Math.max(0,ui.onboardingStep-1);renderOnboarding();}
  if(e.target.id==='onboardingNext'){captureOnboardingStep();if(ui.onboardingStep<4){if(ui.onboardingStep===0){ui.lang=ui.onboardingDraft.language;applyStaticLanguage();const full=ui.onboardingDraft.profile==='full';ui.onboardingDraft.nyaa_enabled=full;ui.onboardingDraft.agent_enabled=full;if(!full)ui.onboardingDraft.qbt_enabled=false;if(ui.onboardingDraft.profile==='local')ui.onboardingDraft.anilist_enabled=false;}ui.onboardingStep+=1;renderOnboarding();}else await finishOnboarding();}
});
document.addEventListener('change',e=>{if(e.target.id==='o_language'){captureOnboardingStep();ui.lang=e.target.value;renderOnboarding();return;}if(['o_anilist_enabled','o_llm_enabled','o_qbt_enabled','o_subtitle_enabled'].includes(e.target.id)){captureOnboardingStep();syncOnboardingVisibility();}});
document.addEventListener('pointerover',event=>{
  const cover=event.target.closest?.('#current .cover-shell.polychrome');
  if(!cover||cover.contains(event.relatedTarget)||!ui.windowActive||ui.page!=='current')return;
  startPolychromeHover(cover);
});
// WKWebView can replace a card while the pointer is already above it, in
// which case no pointerover event is guaranteed.  pointermove is a cheap
// fallback; the per-hover flag prevents repeated restarts while staying on
// the same card.
document.addEventListener('pointermove',event=>{
  const cover=event.target.closest?.('#current .cover-shell.polychrome');
  if(!cover||!ui.windowActive||ui.page!=='current')return;
  startPolychromeHover(cover);
});
document.addEventListener('pointerout',event=>{
  const cover=event.target.closest?.('#current .cover-shell.polychrome');
  if(!cover||cover.contains(event.relatedTarget))return;
  delete cover.dataset.polychromeHoverActive;
});
function editableShortcutTarget(target){return !!target?.closest?.('input,textarea,select,[contenteditable="true"]');}
document.addEventListener('click',event=>{const recorder=event.target.closest?.('.shortcut-recorder');if(recorder){event.preventDefault();event.stopPropagation();startShortcutCapture(recorder);return;}if(ui.shortcutCaptureTarget)stopShortcutCapture();},true);
document.addEventListener('keydown',event=>{
  if(ui.shortcutCaptureTarget){
    event.preventDefault();event.stopPropagation();
    if(event.key==='Escape'){stopShortcutCapture();return;}
    if(event.key==='Backspace'||event.key==='Delete'){const el=ui.shortcutCaptureTarget;el.dataset.shortcutValue='';ui.shortcutCaptureTarget=null;setShortcutRecorder(el,'');return;}
    const value=capturedShortcut(event);if(!value)return;const el=ui.shortcutCaptureTarget;el.dataset.shortcutValue=value;ui.shortcutCaptureTarget=null;setShortcutRecorder(el,value);return;
  }
  const standard=event.metaKey&&!event.ctrlKey&&!event.altKey&&!event.shiftKey;
  if(standard&&/^[1-9]$/.test(event.key)){const buttons=[...document.querySelectorAll('.nav button[data-page]')].filter(button=>button.offsetParent!==null||button.getClientRects().length);const button=buttons[Number(event.key)-1];if(button){event.preventDefault();event.stopPropagation();setPage(button.dataset.page);return;}}
  if(standard&&String(event.key||'').toLowerCase()==='f'){if(ui.page==='settings'){event.preventDefault();event.stopPropagation();const search=$('settingsSearch');if(search){search.focus();search.select();}return;}if(ui.page==='planned'){event.preventDefault();event.stopPropagation();const search=$('plannedSearch');if(search){search.focus();search.select();}return;}}
  void handleEscape(event);
},true);
window.addEventListener('resize',()=>{hideTitleTooltip();applyOverflowTitleTooltips();});
setWindowActivity(!document.hidden&&document.hasFocus());
window.addEventListener('pywebviewready',loadState,{once:true});

document.addEventListener('click',async e=>{
  const target=e.target.closest('[data-ln-action],[data-ln-token],[data-ln-review],[data-ln-anilist-url],#lnImport,#lnRefresh,#lnAutoNyaa,#lnReaderClose,#lnReaderAppearanceToggle,#lnFinishVolume,#lnAddCard,[data-ln-release],[data-ln-anilist-result]');if(!target)return;
  try{
    if(target.id==='lnImport'){const r=await pywebview.api.choose_light_novel_file();if(r?.error)throw new Error(r.error);if(!r?.cancelled){ui.lnState=r.state;renderLightNovels();buildPlannedOnce();updateCount();if(r.errors?.length)toast(r.errors.join(' • '));const first=(r.books||[]).find(b=>!b.anilist_id);if(first)await showLnAniListSearch(first.id,first.title);}return;}
    if(target.id==='lnRefresh'){ui.lnState=await pywebview.api.light_novel_refresh();renderLightNovels();scheduleLnStatePoll();return;}
    if(target.id==='lnAutoNyaa'){const rows=await pywebview.api.light_novel_auto_download();toast(`Light novels added: ${rows.length}`);return;}
    if(target.id==='lnReaderClose'){await saveLnReaderPositionNow();stopLnParsePoll();ui.lnChapterLoadToken++;hideLnTranslation();void pywebview.api.light_novel_cancel_reader_background();$('lnReaderAppearance').classList.remove('open');$('lnReaderShell').classList.remove('open');$('lnStudyPop').classList.remove('open');await loadLightNovels(true);return;}
    if(target.id==='lnReaderAppearanceToggle'){$('lnReaderAppearance').classList.toggle('open');return;}
    if(target.id==='lnFinishVolume'){if(!ui.lnBook)return;await pywebview.api.light_novel_finish_volume(Number(ui.lnBook.id));toast('Volume completed');return;}
    if(target.dataset.lnToken){const sel=window.getSelection();if(sel&&!sel.isCollapsed)return;await showLnPopup(target.dataset.lnToken,target);return;}
    if(target.dataset.lnReview){const token=ui.lnPopupToken;if(!token)return;await pywebview.api.light_novel_study_action({backend:ui.lnState?.settings?.study_backend||'jiten',action:'review',word_id:token.wordId,reading_index:token.readingIndex,grade:target.dataset.lnReview,sentence:token.sentence||''});toast('Review saved');$('lnStudyPop').classList.remove('open');return;}
    if(target.id==='lnAddCard'){const token=ui.lnPopupToken;if(!token)return;const deck=$('lnDeckSelect')?.value||'';await pywebview.api.light_novel_study_action({backend:ui.lnState?.settings?.study_backend||'jiten',action:'add',word_id:token.wordId,reading_index:token.readingIndex,deck_id:deck,sentence:token.sentence||''});toast('Card added');return;}
    if(target.dataset.lnRelease!=null){const row=ui.lnNyaaRows?.[Number(target.dataset.lnRelease)];if(row){await pywebview.api.light_novel_download_nyaa(row);toast('Light novel torrent added');}return;}
    if(target.dataset.lnAnilistResult!=null){const row=ui.lnAniListResults?.[Number(target.dataset.lnAnilistResult)];if(row&&ui.lnAniListBookId){await pywebview.api.light_novel_bind_anilist(Number(ui.lnAniListBookId),Number(row.media_id),row);$('modalBackdrop').classList.remove('open');await loadLightNovels(true);toast('AniList linked');}return;}
    if(target.dataset.lnAnilistUrl){await pywebview.api.open_url(target.dataset.lnAnilistUrl);return;}
    const action=target.dataset.lnAction;
    if(action==='read'){await openLightNovel(Number(target.dataset.id));return;}
    if(action==='nyaa'){await showLnNyaa(Number(target.dataset.id),target.dataset.title||'',target.dataset.volume||'');return;}
    if(action==='anilist-search'){await showLnAniListSearch(Number(target.dataset.id),target.dataset.title||'');return;}
    if(action==='test-study'){await pywebview.api.light_novel_test_study(target.dataset.backend);toast(`${target.dataset.backend} OK`);return;}
  }catch(err){toast(t('error.generic',{error:err.message||err}));}
});
$('lnChapterSelect').addEventListener('change',e=>{void (async()=>{await saveLnReaderPositionNow();await loadLightNovelChapter(Number(e.target.value),0);})();});
$('lnReaderScroll').addEventListener('scroll',()=>{if(!ui.lnBook||!ui.lnChapter)return;if(ui.lnSaveTimer)clearTimeout(ui.lnSaveTimer);ui.lnSaveTimer=setTimeout(()=>{void saveLnReaderPositionNow();},500);});
const LN_READER_CONTROL_IDS=new Set(['lnrFont','lnrFontSize','lnrTheme','lnrTextColor','lnrBgColor','lnrWidth','lnrLineHeight','lnrIndent','lnrVertical','lnrMode','lnrFurigana','lnrCustomCss']);
document.addEventListener('input',e=>{if(!LN_READER_CONTROL_IDS.has(e.target.id))return;if(e.target.id==='lnrTheme')applyLnReaderThemePreset();else if(['lnrTextColor','lnrBgColor'].includes(e.target.id)&&$('lnrTheme'))$('lnrTheme').value='custom';applyLnReaderAppearanceFromControls(true);});
document.addEventListener('change',e=>{if(!LN_READER_CONTROL_IDS.has(e.target.id))return;if(e.target.id==='lnrTheme')applyLnReaderThemePreset();applyLnReaderAppearanceFromControls(true);});
$('lnReader').addEventListener('mouseup',()=>setTimeout(handleLnSelectionTranslation,0));

document.addEventListener('pointerdown',e=>{if(!e.target.closest('#lnStudyPop')&&!e.target.closest('[data-ln-token]'))$('lnStudyPop')?.classList.remove('open');if(!e.target.closest('#lnTranslatePop')&&!e.target.closest('#lnReader'))hideLnTranslation();if(!e.target.closest('#lnReaderAppearance')&&!e.target.closest('#lnReaderAppearanceToggle'))$('lnReaderAppearance')?.classList.remove('open');});

</script>
