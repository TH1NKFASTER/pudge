[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pudge"
version = "0.8.1"
description = "A local-first Mac app for anime, Japanese subtitles, manga, Light Novels, and audiobooks"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "pudge" }]
dependencies = [
  "httpx>=0.27,<1",
  "rapidfuzz>=3.9,<4",
  "anitopy>=2.1.1,<3",
  "charset-normalizer>=3.3,<4",
  # Imported directly (audio fingerprints, alignment); it used to arrive only through ffsubsync.
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "socksio>=1.0,<2",
  "pywebview>=6.2,<7",
  "pyobjc-core>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-ScreenCaptureKit>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Security>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-UserNotifications>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
sync = [
  "ffsubsync>=0.4.31,<0.5",
  "mlx>=0.11; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "tiktoken>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
  "coverage[toml]>=7,<8",
  "hypothesis>=6,<7",
  "mypy>=1.13,<2",
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[project.scripts]
pudge = "pudge.cli:main"
pudge-agent = "pudge.agent:main"

[tool.setuptools.packages.find]
include = ["pudge*"]

[tool.setuptools.package-data]
pudge = ["build-info.json", "brand.env", "config.example.toml", "mpv_scripts/*.lua", "web/*.html", "web/*.css", "web/*.js", "web/*.png", "subtitles/*.json", "assets/*", "THIRD_PARTY_NOTICES.md", "whisper_mlx/LICENSE", "whisper_mlx/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
environments = ["sys_platform == 'darwin'"]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# Vendored MLX Whisper keeps upstream's code (string annotations of a class it never imports).
"pudge/whisper_mlx/{audio,decoding,load_models,timing,tokenizer,transcribe,whisper}.py" = ["E731", "E741", "F821"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
