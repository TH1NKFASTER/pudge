name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.6.68"
        required: true

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,sync]"

      - name: Run quality gates
        run: make quality PYTHON=python

  verify-and-test:
    name: Tests ${{ matrix.batch }}/4
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev,sync]"

      - name: Verify tag version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: python .github/release/check_release_tag.py "$RELEASE_TAG"

      - name: Verify release metadata and lockfile
        run: python .github/release/check_release_metadata.py

      - name: Run test batch
        run: python .github/release/run_test_batch.py --batch $(( ${{ matrix.batch }} - 1 )) --batches 4

  build-release:
    name: Build macOS release ZIP
    needs: [quality, verify-and-test]
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip setuptools wheel uv

      - name: Build release archive
        env:
          PUDGE_TRIAL_JIMAKU_API_KEY: ${{ secrets.PUDGE_TRIAL_JIMAKU_API_KEY }}
        run: |
          test -n "$PUDGE_TRIAL_JIMAKU_API_KEY"
          SKIP_TESTS=1 ./build_release.sh

      - name: Locate archive
        id: archive
        shell: bash
        run: |
          archive=$(find dist -maxdepth 1 -name '[0-9]*.[0-9]*.[0-9]*.zip' -print -quit)
          test -n "$archive"
          test -f "$archive.sha256"
          version=$(basename "$archive" .zip)
          legacy="dist/pudge-macos-v${version}.zip"
          test -f "$legacy"
          test -f "$legacy.sha256"
          echo "path=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"
          echo "legacy=$legacy" >> "$GITHUB_OUTPUT"
          echo "legacy_checksum=$legacy.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pudge-macos
          path: |
            ${{ steps.archive.outputs.path }}
            ${{ steps.archive.outputs.checksum }}
            ${{ steps.archive.outputs.legacy }}
            ${{ steps.archive.outputs.legacy_checksum }}

      - name: Extract release notes from changelog
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1].strip()
          version = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"(?ms)^## v?{re.escape(version)}(?:\s|—).*?(?=^## (?:v?\d|Unreleased)|\Z)",
              text,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no release section for {tag}")
          lines = match.group(0).strip().splitlines()
          notes = "\n".join(lines[1:]).strip() + "\n"
          if not notes.strip():
              raise SystemExit(f"release notes for {tag} are empty")
          Path("dist/release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ARCHIVE: ${{ steps.archive.outputs.path }}
          CHECKSUM: ${{ steps.archive.outputs.checksum }}
          LEGACY: ${{ steps.archive.outputs.legacy }}
          LEGACY_CHECKSUM: ${{ steps.archive.outputs.legacy_checksum }}
          NOTES: dist/release-notes.md
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" "$LEGACY" "$LEGACY_CHECKSUM" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "${RELEASE_TAG#v}" \
              --notes-file "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$CHECKSUM" "$LEGACY" "$LEGACY_CHECKSUM" \
              --title "${RELEASE_TAG#v}" \
              --notes-file "$NOTES"
          fi
