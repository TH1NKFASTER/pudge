name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests ${{ matrix.batch }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev,sync]"

      - name: Run test batch
        run: python scripts/run_test_batch.py --batch $(( ${{ matrix.batch }} - 1 )) --batches 4

  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q pudge scripts

  lint:
    name: Lint and UI modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check fatal Python errors
        run: python -m ruff check --select E9,F63,F7 pudge tests scripts
      - name: Lint new pipeline and media modules
        run: python -m ruff check --select E9,F pudge/audiobooks.py pudge/manga.py pudge/subtitles pudge/backup.py tests/test_p0_p1_features.py tests/test_ui_integration.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript modules
        run: |
          node --check pudge/web/settings.js
          node --check pudge/web/media.js

  macos-smoke:
    name: macOS smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run migration, media and UI smoke tests
        run: python -m pytest -q tests/test_p0_p1_features.py tests/test_ui_integration.py tests/test_config.py
