name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests ${{ matrix.batch }}/4
    # uv.lock resolves for macOS only (tool.uv.environments): the locked install needs a Mac.
    # Python 3.12 only: the Python the app's installer sets up (and the release checks use).
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        batch: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade uv
          uv sync --locked --extra dev --extra sync --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run test batch
        run: python .github/release/run_test_batch.py --batch $(( ${{ matrix.batch }} - 1 )) --batches 4 --results-dir "test-results/batch-${{ matrix.batch }}"

      - name: Upload test batch results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-batch${{ matrix.batch }}
          path: test-results/
          if-no-files-found: error

  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q pudge .github/release

  lint:
    name: Lint and UI modules
    # Nothing of the project is installed: ruff and mypy at the versions uv.lock pins (keep them
    # equal; a test checks it) and the standard-library release scripts, so Linux will do.
    runs-on: ubuntu-latest
    env:
      RUFF: ruff@0.16.3
      MYPY: mypy@1.20.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Check Python
        run: |
          uvx "$RUFF" check --select E9,F pudge .github/release
          uvx "$RUFF" check --select E9,F63,F7 tests
          uvx "$RUFF" check --select BLE001 pudge/task_supervisor.py pudge/identity.py pudge/cache_registry.py pudge/diagnostics.py pudge/safe_mode.py pudge/web_state.py pudge/web_controllers.py pudge/manager_services.py pudge/providers/base.py
          uvx "$RUFF" format --check pudge tests scripts .github
          python .github/release/sync_config_example.py --check
          uvx "$MYPY" --platform darwin --follow-imports=skip pudge/task_supervisor.py pudge/identity.py pudge/cache_registry.py pudge/diagnostics.py pudge/safe_mode.py pudge/web_state.py pudge/providers/base.py
          python .github/release/check_release_metadata.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript modules
        run: find pudge/web -type f -name '*.js' -print0 | xargs -0 -n1 node --check

  macos-smoke:
    name: macOS smoke
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade uv
          uv sync --locked --extra dev --python "$(command -v python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run migration, media and UI smoke tests
        run: python -m pytest -q tests/test_p0_p1_features.py tests/test_ui_integration.py tests/test_config.py
      - name: Verify SRT fallback without Homebrew media tools
        run: |
          PYTHON_BIN="$(command -v python)"
          PATH="$(dirname "$PYTHON_BIN"):/usr/bin:/bin" "$PYTHON_BIN" -m pytest -q \
            tests/test_v0118_runtime_reset_permissions.py::test_runtime_subtitle_recovers_selected_history_and_repairs_db \
            tests/test_subtitle_formats.py::test_ass_is_converted_to_plain_srt_without_styles
