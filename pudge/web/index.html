<style>
:root {
  color-scheme: dark;
  --bg:#0b1320; --panel:#111d2d; --panel2:#162438; --line:#25364d;
  --text:#edf4ff; --muted:#94a6bd; --accent:#6f8cff; --pink:#f06292;
  --good:#57d38c; --warn:#f4bd63; --danger:#ff6b7d;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif; }
/* pudge-v0.7.24-interface-selection-v1: chrome is UI, not copyable document text. */
body, body * { user-select:none; -webkit-user-select:none; }
input,textarea,[contenteditable="true"],.log-output,.pudge-debug-overlay,.pudge-debug-overlay *,#lnReader,#lnReader *,.anime-card[data-planned="1"] .anime-title,.audiobook-title-row strong,.vn-current,.vn-transcript-list { user-select:text; -webkit-user-select:text; }
#lnReader rt,#lnReader rp { user-select:none; -webkit-user-select:none; }
button,input,select { font:inherit; }
button { border:1px solid var(--line); background:#1a2b42; color:var(--text); border-radius:8px; padding:8px 12px; cursor:pointer; }
button:hover { background:#243a56; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.ghost { background:transparent; }
/* pudge-v0.7.23-destructive-red-v1: destructive actions are always red. */
button.danger-action,button.selection-delete,button.uninstall-pudge {
  background:rgba(255,107,125,.16);
  border-color:var(--danger);
  color:#ffd9df;
}
button.danger-action:hover,button.selection-delete:hover,button.uninstall-pudge:hover {
  background:rgba(255,107,125,.28);
  border-color:var(--danger);
  color:#fff;
}
button:disabled { opacity:.62; cursor:default; }
.play-button { min-width:108px; }
.spinner { display:inline-block; width:13px; height:13px; margin-right:7px; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; vertical-align:-2px; animation:spin .75s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
#refreshAll { display:flex; align-items:center; justify-content:center; gap:7px; }
#app { display:grid; grid-template-columns:220px 1fr; height:100%; }
.sidebar { background:#0f1a29; border-right:1px solid var(--line); padding:18px 16px 22px; display:flex; flex-direction:column; min-width:220px; }

.nav button.active { background:#1b2d45; color:white; }
.sidebar-bottom { margin-top:auto; display:grid; gap:8px; }
#torrentToggleButton{display:grid;gap:2px;line-height:1.15;font-weight:800;transition:background .12s ease,border-color .12s ease}#torrentToggleButton.torrent-on{background:#173d2b;border-color:#46c77e;color:#e8fff1}#torrentToggleButton.torrent-on:hover{background:#1f5138}#torrentToggleButton.torrent-off{background:#4a2028;border-color:#ef6575;color:#fff0f2}#torrentToggleButton.torrent-off:hover{background:#612a35}#torrentToggleButton small{font-size:10px;color:currentColor;opacity:.78;font-weight:600}
.status { display:none; }
.title-tooltip { position:fixed; z-index:10020; max-width:min(440px,calc(100vw - 24px)); padding:8px 10px; border:1px solid #405675; border-radius:8px; background:rgba(5,12,22,.97); color:#fff; font-size:12px; line-height:1.35; box-shadow:0 8px 28px rgba(0,0,0,.42); pointer-events:none; opacity:0; transform:translateY(3px); transition:opacity .09s ease,transform .09s ease; overflow-wrap:anywhere; }

.relation-preview { position:fixed; z-index:10025; width:min(270px,calc(100vw - 24px)); display:grid; grid-template-columns:82px minmax(0,1fr); gap:11px; align-items:start; padding:10px; border:1px solid #506986; border-radius:11px; background:rgba(5,12,22,.98); color:#fff; box-shadow:0 12px 38px rgba(0,0,0,.52); pointer-events:none; opacity:0; transform:translateY(4px); transition:opacity .1s ease,transform .1s ease; }

.main { min-width:0; height:100%; overflow:hidden; display:flex; flex-direction:column; }

.toolbar .count { color:var(--muted); }
.toolbar .spacer { flex:1; }
.page-selection-actions{display:flex;align-items:center;gap:8px}.page-selection-actions[hidden]{display:none!important}.selection-count{color:var(--muted);font-size:12px}.selection-delete{background:rgba(255,107,125,.16);border-color:var(--danger);color:#ffd9df}.selection-delete:hover{background:rgba(255,107,125,.28)}
.drop-focus{animation:pudgeDropFocus 1.5s ease-out}
@keyframes pudgeDropFocus{0%,35%{box-shadow:0 0 0 3px var(--accent),0 0 28px rgba(111,140,255,.55)}100%{box-shadow:none}}
.page-scroll { flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:20px 24px 40px; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.page { display:none; }
.page.active { display:block; }
.section-title { font-size:18px; font-weight:700; margin:0 0 12px; }
.ready-sections { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(560px,100%),1fr)); gap:0 24px; align-items:start; }

.airing-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(124px,1fr)); gap:12px; margin-bottom:28px; }
.airing-card { position:relative; display:flex; flex-direction:column; min-width:0; border:2px solid var(--accent); border-radius:9px; overflow:hidden; background:var(--panel2); cursor:pointer; box-shadow:0 3px 14px rgba(0,0,0,.2); }
.airing-card.outdated { border-color:var(--pink); }
.downloaded-card { border-color:var(--good); }
.waiting-card { border-color:var(--warn); cursor:pointer; }
.download-available-card { border-color:#8e7dff; cursor:default; }
.download-available-card .cover-action { display:block; width:100%; max-width:none; }
.download-available-card .airing-meta { height:68px; min-height:68px; }
.download-card-button { margin-top:auto; width:100%; padding:5px 7px; font-size:9px; line-height:1.1; }

.dropped-card { border-color:var(--danger); cursor:pointer; opacity:.9; }

.airing-card.play-starting::after,.airing-card.play-running::after { position:absolute; inset:0; display:grid; place-items:center; background:rgba(4,10,18,.72); color:white; font-weight:750; z-index:6; text-align:center; padding:8px; }
.airing-card.play-starting::after { content:attr(data-starting-label); }
.airing-card.play-running::after { content:attr(data-running-label); }
.airing-cover-shell { width:100%; aspect-ratio:104/146; border-radius:0; }
.airing-card img,.cover-placeholder { width:100%; height:100%; display:block; object-fit:cover; background:#20334f; }
.cover-placeholder { display:grid; place-items:center; color:var(--muted); }
.airing-meta { flex:1; height:68px; min-height:68px; display:flex; flex-direction:column; text-align:center; padding:5px 4px 7px; background:rgba(24,38,58,.96); overflow:hidden; }
.airing-meta strong { display:-webkit-box; min-height:29px; font-size:12px; line-height:1.2; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
.airing-meta span { display:block; font-size:11px; color:#dbe7ff; margin-top:2px; }

.airing-card.outdated .airing-state { color:#ffb5c8!important; }
.ready-sequence-card { position:relative; min-width:0; display:flex; flex-direction:column; overflow:hidden; border:2px solid rgba(87,211,140,.72); border-radius:9px; background:var(--panel2); box-shadow:0 3px 14px rgba(0,0,0,.2); cursor:pointer; }
.ready-sequence-cover { position:relative; width:100%; aspect-ratio:104/146; overflow:hidden; background:#20334f; }
.ready-sequence-cover img { width:100%; height:100%; display:block; object-fit:cover; }
.ready-sequence-count-wrap { position:absolute; z-index:8; right:6px; top:6px; }

.ready-sequence-switch { position:absolute; z-index:6; top:50%; width:28px; height:38px; display:grid; place-items:center; padding:0; border:1px solid rgba(255,255,255,.34); border-radius:8px; background:rgba(4,10,18,.78); color:#fff; font-size:24px; line-height:1; box-shadow:0 2px 10px rgba(0,0,0,.35); transform:translateY(-50%); }
.ready-sequence-switch:hover { background:rgba(35,62,94,.94); transform:translateY(-50%); }

.ready-sequence-meta { height:68px; min-height:68px; display:flex; flex-direction:column; justify-content:center; gap:3px; padding:6px 5px 7px; text-align:center; background:rgba(24,38,58,.96); overflow:hidden; }
.ready-sequence-meta strong { display:-webkit-box; min-height:29px; font-size:12px; line-height:1.2; overflow:hidden; -webkit-box-orient:vertical; -webkit-line-clamp:2; }

.ready-sequence-list { position:absolute; z-index:7; inset:6px; max-height:calc(100% - 12px); display:flex; flex-direction:column; gap:4px; padding:36px 7px 7px; overflow:auto; background:rgba(4,10,18,.96); border:1px solid rgba(255,255,255,.24); border-radius:9px; opacity:0; pointer-events:none; transition:opacity .12s ease; }
.ready-sequence-count-wrap:hover + .ready-sequence-list,.ready-sequence-count-wrap:focus-within + .ready-sequence-list,.ready-sequence-list:hover,.ready-sequence-list:focus-within { opacity:1; pointer-events:auto; }
.ready-sequence-row { width:100%; display:grid; grid-template-columns:22px minmax(0,1fr); align-items:center; gap:6px; padding:6px; border:1px solid #365477; border-radius:6px; background:rgba(24,38,58,.96); color:#eef4ff; text-align:left; box-shadow:none; }

.ready-sequence-row-title { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:10px; }
.hover-title { position:absolute; inset:auto 0 54px 0; background:rgba(4,10,18,.9); color:#fff; padding:8px 6px; font-size:11px; line-height:1.25; text-align:center; opacity:0; transform:translateY(4px); transition:opacity .12s ease,transform .12s ease; pointer-events:none; z-index:5; }
.airing-card:hover .hover-title { opacity:1; transform:none; }
.card-list { display:grid; gap:10px; }
.anime-card { display:grid; grid-template-columns:7px 90px minmax(0,1fr) auto; gap:13px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px; align-items:start; }
.anime-card .stripe { width:7px; height:100%; min-height:118px; border-radius:5px; background:transparent; }

.list-cover-shell { width:90px; height:126px; border-radius:6px; }
.anime-card img,.list-cover-placeholder { width:100%; height:100%; object-fit:cover; border-radius:inherit; background:#20334f; }

.cover-action:hover { background:transparent; transform:none; box-shadow:0 0 0 2px rgba(111,140,255,.45); }
.list-cover-placeholder { display:grid; place-items:center; color:var(--muted); font-size:11px; }
.anime-title { font-size:16px; font-weight:750; margin:1px 0 7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.inline-settings-link{display:inline-flex;align-items:center;width:max-content;padding:2px 0;border:0;background:transparent;color:#9fb5ff;font-size:11px;text-decoration:underline;text-underline-offset:2px}.inline-settings-link:hover{background:transparent;color:#c6d2ff}.credential-field{display:grid;gap:3px;min-width:0}.credential-field>.inline-settings-link{justify-self:start}
.good { color:var(--good); } .warning { color:var(--warn); } .danger { color:var(--pink); }
.card-actions { display:grid; gap:6px; min-width:118px; }

@keyframes polychrome-flow {
  0% { background-position:0% 20%,0 0,0 0,0 0; filter:hue-rotate(0deg) saturate(1.65) brightness(1.1); }
  50% { background-position:100% 80%,40px 30px,-28px 42px,70px -30px; filter:hue-rotate(160deg) saturate(2.05) brightness(1.18); }
  100% { background-position:0% 20%,80px 60px,-56px 84px,140px -60px; filter:hue-rotate(360deg) saturate(1.65) brightness(1.1); }
}
@keyframes polychrome-glint {
  0%,18% { transform:translateX(-190%) skewX(-18deg); opacity:0; }
  31% { opacity:1; }
  58%,100% { transform:translateX(285%) skewX(-18deg); opacity:0; }
}
/* Keep the foil look while idle, but do not keep WKWebView/GPU awake forever.
   The expensive motion is a short one-shot when Watching becomes active or
   when the user deliberately hovers a polychrome cover. */
.cover-shell { position:relative; overflow:hidden; background:#20334f; isolation:isolate; }
.cover-shell.polychrome { box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 18px rgba(91,216,255,.5),0 0 34px rgba(255,84,208,.24); }
.cover-shell.polychrome::before {
  content:""; position:absolute; inset:-22%; z-index:2; pointer-events:none;
  background:
    conic-gradient(from 20deg at 48% 42%,rgba(255,53,197,.4),rgba(63,226,255,.75),rgba(255,228,56,.68),rgba(132,73,255,.78),rgba(255,53,197,.4)),
    repeating-linear-gradient(117deg,rgba(255,255,255,.34) 0 1px,transparent 1px 7px),
    repeating-linear-gradient(23deg,rgba(54,225,255,.32) 0 2px,rgba(255,58,200,.27) 2px 5px,transparent 5px 11px),
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.5),transparent 28%);
  background-size:190% 190%,40px 30px,56px 42px,120px 120px;
  background-position:0% 20%,0 0,0 0,0 0;
  filter:hue-rotate(0deg) saturate(1.65) brightness(1.1);
  mix-blend-mode:color-dodge;
  opacity:.9;
  animation:none;
}
.cover-shell.polychrome::after {
  content:""; position:absolute; z-index:3; top:-35%; bottom:-35%; left:-60%; width:48%; pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,rgba(97,238,255,.24) 20%,rgba(255,255,255,.98) 48%,rgba(255,87,219,.34) 70%,transparent 100%);
  mix-blend-mode:screen;
  transform:translateX(-190%) skewX(-18deg);
  opacity:0;
  animation:none;
}
.cover-shell.polychrome img { filter:contrast(1.1) saturate(1.28) brightness(1.05); }
.cover-shell.polychrome.polychrome-wake::before,
.cover-shell.polychrome.polychrome-hover-wake::before { animation:polychrome-flow 1.875s ease-out 1 both; }
.cover-shell.polychrome.polychrome-wake::after,
.cover-shell.polychrome.polychrome-hover-wake::after { animation:polychrome-glint 1.425s ease-out 1 both; }
/* Preserve the current foil frame, but stop every CSS animation while the
   macOS window is not active. This lets WKWebView/GPU enter an idle state. */
html.ui-inactive *,
html.ui-inactive *::before,
html.ui-inactive *::after { animation-play-state:paused !important; }
/* WebKit can briefly lose compositor tiles when the foil blend layers move

/* pudge-v0.7.25-ln-native-selection-repair-v1 */

/* pudge-v133-ln-furigana-dom-overlay-v1
   Horizontal furigana uses a plain inline <span>, never native WebKit ruby.
   The reading exists only as an absolutely-positioned paint overlay, so its
   length cannot change word width or line height. Vertical mode converts the
   same nodes back to native <ruby><rt>. */
/* v135: reserve one fixed half-em furigana lane in every horizontal line.
   The overlay itself remains out of layout, so long readings never reflow text. */
#lnReader:not(.vertical){line-height:calc(var(--ln-line-height,1.9) + .5)}
#lnReader:not(.vertical) .ln-furigana-ruby{position:relative}
#lnReader:not(.vertical) .ln-furigana-ruby::after{
  content:attr(data-ln-reading);
  display:none;
  position:absolute;
  z-index:4;
  left:50%;
  bottom:calc(100% - 1px);
  /* The old center landed about half a base glyph to the right in WebKit.
     1em here equals .5em of the parent because the overlay font is .5em. */
  transform:translateX(calc(-50% - 1em));
  width:max-content;
  max-width:none;
  white-space:nowrap;
  pointer-events:none;
  color:currentColor;
  font-size:.5em;
  font-weight:400;
  line-height:1;
  letter-spacing:normal;

// Own Torrent On/Off at capture phase so later optional UI handlers cannot
// shadow the authoritative same-origin HTTP switch.
async function torrentToggleHttpCapture(){
  if(ui.torrentToggleCaptureInFlight)return;
  const button=$('torrentToggleButton');if(!button)return;
  const previous=torrentToggleUiEnabled(),desired=!previous;
  ui.torrentToggleCaptureInFlight=true;ui.torrentToggleDesired=desired;
  button.disabled=true;refreshTorrentToggle();
  try{
    const result=await Promise.race([
      torrentHttpJson('/api/torrents/enabled',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:desired})}),
      new Promise((_,reject)=>setTimeout(()=>reject(new Error('Torrent toggle HTTP timeout')),3000)),
    ]);
    if(Boolean(result?.enabled)!==desired)throw new Error('Torrent toggle backend did not persist requested state');
    if(ui.state?.settings)ui.state.settings.torrents_enabled=Boolean(result.enabled);
    ui.torrentTraffic={...(ui.torrentTraffic||{}),enabled:Boolean(result.enabled),updated_at:Date.now()/1000};
    toast(desired?(ui.lang==='ru'?'Торренты включены':'Torrents enabled'):(ui.lang==='ru'?'Торренты выключены':'Torrents disabled'));
  }catch(error){
    if(ui.state?.settings)ui.state.settings.torrents_enabled=previous;
    ui.torrentTraffic=null;toast(t('error.generic',{error:error?.message||error}));
  }finally{
    ui.torrentToggleDesired=null;ui.torrentToggleCaptureInFlight=false;button.disabled=false;
    refreshTorrentToggle();scheduleTorrentTrafficPoll(0);renderDownloads();
  }
}
document.addEventListener('click',event=>{
  const button=event.target?.closest?.('#torrentToggleButton');if(!button)return;
  event.preventDefault();event.stopImmediatePropagation();void torrentToggleHttpCapture();

function hydrateCompactRelationsFromGraph(a,graph){

  const byId=new Map(nodes.map(item=>[Number(item.media_id),item]));
  const rootId=Number(a.media_id);if(!byId.has(rootId))return false;

  for(const edge of edges){

    if(edge.target===rootId&&byId.has(edge.source))directPre.push(byId.get(edge.source));
    if(edge.source===rootId&&byId.has(edge.target))directSeq.push(byId.get(edge.target));

  const unique=items=>[...new Map(items.map(item=>[Number(item.media_id),item])).values()].sort((x,y)=>relationDateNumber(x)-relationDateNumber(y)||Number(x.media_id)-Number(y.media_id));

  const secondSeq=unique(seq.flatMap(item=>edges.filter(edge=>edge.relation_type==='SEQUEL'&&edge.source===Number(item.media_id)&&byId.has(edge.target)).map(edge=>byId.get(edge.target))));
  if(!pre.length&&!seq.length&&!secondPre.length&&!secondSeq.length)return false;

    current,
    prequel_levels:[secondPre.slice(-2),pre.slice(-2)].filter(level=>level.length),
    sequel_levels:[seq.slice(0,2),secondSeq.slice(0,2)].filter(level=>level.length),
    full_prequel_levels:[secondPre,pre].filter(level=>level.length),
    full_sequel_levels:[seq,secondSeq].filter(level=>level.length),
    order_mode:'anilist'

}

function formatEpisodeRanges(values){
  const episodes=[...new Set((values||[]).filter(value=>Number.isInteger(value)).map(Number))].sort((a,b)=>a-b);

  const ranges=[];
  let start=episodes[0],end=episodes[0];
  for(let i=1;i<episodes.length;i++){
    const value=episodes[i];
    if(value===end+1){end=value;continue;}
    ranges.push(start===end?String(start):`${start}-${end}`);
    start=end=value;
  }
  ranges.push(start===end?String(start):`${start}-${end}`);
  return ranges.join(',');
}

  const beforeBookIds=JSON.stringify((ui.lnState?.books||[]).map(book=>Number(book.id)));
  ui.lnStatePollTimer=setTimeout(async()=>{
    try{
      const next=await pywebview.api.light_novel_state(),nextSignature=lnStateRenderSignature(next),nextAudiobookActive=!!next.irodori_tts_active;
      const nextBookIds=JSON.stringify((next?.books||[]).map(book=>Number(book.id))),bookListChanged=nextBookIds!==beforeBookIds;
      ui.lnState=next;
      // Audiobook progress is intentionally patched in place. During resume Pudge can
      // discover already-generated chapters and update book metadata several times; a
      // full render on those updates made the whole LN page visibly blink. Defer that
      // render until the job finishes, unless the actual book list changed.
      let needsFullRender=false;
      if((wasAudiobookActive||nextAudiobookActive)&&!bookListChanged){
        patchLnAudiobookProgress(next);
        needsFullRender=wasAudiobookActive&&!nextAudiobookActive&&nextSignature!==beforeSignature;

}

    // Hidden tabs report zero/tiny geometry. Never persist that measurement as

    if(firstHeight<50||(second&&secondHeight<50))continue;

function appUpdateMessage(state){
  if(!state)return '';
  if(state.state==='checking'||state.state==='preparing')return t('update.checking');
  if(state.state==='downloading')return t('update.downloading');
  if(state.state==='installing')return t('update.installing');
  if(state.state==='restarting')return t('update.restarting');
  if(state.state==='failed')return state.detail||t('error.generic',{error:'Update failed'});
  if(state.blocked)return t('update.devBlocked',{reason:state.detail||'unknown'});
  if(state.channel==='development')return state.available?t('update.devAvailable'):t('update.devCurrent');
  return state.available?t('update.available',{version:state.latest_version||'—'}):t('update.current');
}
function renderAppUpdateState(state){
  const status=$('appUpdateState'),check=$('checkAppUpdate'),install=$('installAppUpdate'),log=$('openAppUpdateLog');
  if(!status||!check||!install||!log)return;
  const busy=!!state?.running||['checking','preparing','downloading','installing','restarting'].includes(state?.state);
  status.textContent=appUpdateMessage(state);status.classList.toggle('danger',state?.state==='failed'||!!state?.blocked);
  check.disabled=busy;install.hidden=!state?.available||!!state?.blocked;install.disabled=busy;
  log.hidden=state?.state!=='failed';
}
async function checkAppUpdate(){
  ui.appUpdate={state:'checking',running:true};renderAppUpdateState(ui.appUpdate);
  try{ui.appUpdate=await pywebview.api.app_update_status(true);renderAppUpdateState(ui.appUpdate);}
  catch(error){ui.appUpdate={state:'failed',detail:error?.message||String(error)};renderAppUpdateState(ui.appUpdate);}
}
async function pollAppUpdate(){
  if(ui.appUpdatePollTimer){clearTimeout(ui.appUpdatePollTimer);ui.appUpdatePollTimer=null;}
  try{ui.appUpdate=await pywebview.api.app_update_progress();renderAppUpdateState(ui.appUpdate);}
  catch(error){ui.appUpdate={state:'failed',detail:error?.message||String(error)};renderAppUpdateState(ui.appUpdate);return;}
  if(ui.appUpdate?.running||['preparing','downloading','installing'].includes(ui.appUpdate?.state))ui.appUpdatePollTimer=setTimeout(pollAppUpdate,750);
}
async function installAppUpdate(){
  try{ui.appUpdate=await pywebview.api.app_update_install();renderAppUpdateState(ui.appUpdate);await pollAppUpdate();}
  catch(error){ui.appUpdate={state:'failed',detail:error?.message||String(error)};renderAppUpdateState(ui.appUpdate);}
}

function adaptiveDownloadPollDelay(download,nowMs=Date.now()){

  const elapsed=Math.max(0,(nowMs-Number(previous.at||nowMs))/1000);
  const delta=progress-Number(previous.progress||0);
  let rate=Number(previous.rate||0);
  let samples=Number(previous.samples||1);

    if(delta>0){const instant=delta/elapsed;rate=rate>0?rate*.65+instant*.35:instant;}

  if(!(rate>1e-7))return 60000;

  let delaySeconds=Math.max(20,Math.min(60,etaSeconds*.5));

const SCORE_WHEEL_WEIGHTS=[1,2,4,7,10,10,7,4,2,1];
const SCORE_WHEEL_TOTAL=SCORE_WHEEL_WEIGHTS.reduce((sum,value)=>sum+value,0);
function scoreWheelSegments(){
  let offset=0;const segments=[];
  for(let score=1;score<=10;score++){
    const weight=SCORE_WHEEL_WEIGHTS[score-1],start=offset/SCORE_WHEEL_TOTAL*360;
    offset+=weight;const end=offset/SCORE_WHEEL_TOTAL*360;
    segments.push({score,start,end,center:(start+end)/2});
  }
  return segments;
}
function scoreWheelGradient(){
  const colors=['#a93c4a','#c64e42','#d66d37','#db9235','#d2b63c','#aebe48','#78b85b','#4cac78','#439eb0','#6f8cff'];
  return `conic-gradient(${scoreWheelSegments().map((segment,index)=>`${colors[index]} ${segment.start}deg ${segment.end}deg`).join(',')})`;
}
function chooseWheelResult(previous=null){
  let pick=Math.random()*SCORE_WHEEL_TOTAL,score=1;
  for(let index=0;index<SCORE_WHEEL_WEIGHTS.length;index++){pick-=SCORE_WHEEL_WEIGHTS[index];if(pick<0){score=index+1;break;}}
  if(previous!=null&&score===previous){return chooseWheelResult(previous);}
  const segment=scoreWheelSegments()[score-1];
  const target=segment.start+Math.random()*(segment.end-segment.start);
  return {score,target};
}
function scoreWheelLabels(){return scoreWheelSegments().map(segment=>`<span class="score-wheel-label" style="--angle:${segment.center}deg">${segment.score}</span>`).join('');}

function graphWithoutRelated(graph,rootId=null){
  const nodes=(graph?.nodes||[]).filter(item=>item&&item.media_id!=null);
  const byId=new Map(nodes.map(item=>[Number(item.media_id),item]));
  const edges=(graph?.edges||[]).map(edge=>({...edge,source:Number(edge.source),target:Number(edge.target),relation_type:String(edge.relation_type||'OTHER').toUpperCase()})).filter(edge=>byId.has(edge.source)&&byId.has(edge.target)&&edge.source!==edge.target&&!['CHARACTER','SHARED_CHARACTERS','RELATED','OTHER'].includes(edge.relation_type));
  const root=Number(rootId??graph?.root_id);
  if(!byId.has(root))return {...graph,nodes,edges};
  const adjacency=new Map(nodes.map(item=>[Number(item.media_id),[]]));
  for(const edge of edges){adjacency.get(edge.source)?.push(edge.target);adjacency.get(edge.target)?.push(edge.source);}
  const visible=new Set([root]),queue=[root];
  while(queue.length){const current=queue.shift();for(const next of adjacency.get(current)||[]){if(visible.has(next))continue;visible.add(next);queue.push(next);}}
  return {...graph,nodes:nodes.filter(item=>visible.has(Number(item.media_id))),edges:edges.filter(edge=>visible.has(edge.source)&&visible.has(edge.target))};
}
function cachedRelationGraph(mediaId){
  const cache=ui.relationGraphCache||{};
  const graphId=cache.mediaToGraph?.[String(Number(mediaId))];
  const item=graphId?cache.graphs?.[graphId]:null;
  if(!item?.graph)return null;
  return graphWithoutRelated({...item.graph,root_id:Number(mediaId),refreshed_at:Number(item.refreshed_at||0),next_refresh_at:Number(item.next_refresh_at||0),graph_id:String(graphId)},mediaId);
}
function cacheRelationGraph(graph){
  const clean=graphWithoutRelated(graph,graph?.root_id);
  const nodes=(clean?.nodes||[]).filter(item=>item&&item.media_id!=null);
  if(!nodes.length)return;
  const graphId=String(clean.graph_id||`component-${Math.min(...nodes.map(item=>Number(item.media_id)))}`);
  const cache=ui.relationGraphCache||(ui.relationGraphCache={graphs:{},mediaToGraph:{}});
  const staleIds=new Set(nodes.map(item=>cache.mediaToGraph?.[String(Number(item.media_id))]).filter(Boolean));
  for(const staleId of staleIds)if(staleId!==graphId)delete cache.graphs[staleId];
  const stored={...clean};delete stored.root_id;delete stored.refreshed_at;delete stored.next_refresh_at;delete stored.graph_id;
  cache.graphs[graphId]={graph:stored,refreshed_at:Number(clean.refreshed_at||0),next_refresh_at:Number(clean.next_refresh_at||0)};
  for(const node of nodes)cache.mediaToGraph[String(Number(node.media_id))]=graphId;
}

function initFullRelationGraphInteractions(root=$('modalBody')){
  const viewport=root?.querySelector('.full-relation-viewport');
  const canvas=viewport?.querySelector('.full-relation-canvas');
  if(!viewport||!canvas||viewport.dataset.zoomReady==='1')return;
  viewport.dataset.zoomReady='1';
  let scale=1,dragging=false,startX=0,startY=0,startLeft=0,startTop=0;
  const clamp=value=>Math.min(2.2,Math.max(.45,value));
  const zoomValue=root.querySelector('[data-relation-zoom-value]');
  const apply=(nextScale,clientX=null,clientY=null)=>{
    nextScale=clamp(nextScale);
    const rect=viewport.getBoundingClientRect();
    const px=clientX==null?rect.left+viewport.clientWidth/2:clientX;
    const py=clientY==null?rect.top+viewport.clientHeight/2:clientY;
    const contentX=(viewport.scrollLeft+(px-rect.left))/scale;
    const contentY=(viewport.scrollTop+(py-rect.top))/scale;
    scale=nextScale;
    canvas.style.transform=`scale(${scale})`;
    canvas.style.marginRight=`${Math.max(0,Number(viewport.dataset.graphWidth||canvas.offsetWidth)*(scale-1))}px`;
    canvas.style.marginBottom=`${Math.max(0,Number(viewport.dataset.graphHeight||canvas.offsetHeight)*(scale-1))}px`;
    viewport.scrollLeft=contentX*scale-(px-rect.left);
    viewport.scrollTop=contentY*scale-(py-rect.top);
    if(zoomValue)zoomValue.textContent=`${Math.round(scale*100)}%`;
  };
  viewport.addEventListener('wheel',event=>{
    if(!(event.ctrlKey||event.metaKey||event.altKey))return;
    event.preventDefault();
    apply(scale*Math.exp(-event.deltaY*.0025),event.clientX,event.clientY);
  },{passive:false});
  viewport.addEventListener('pointerdown',event=>{
    if(event.button!==0||event.target.closest('button,a,.relation-node'))return;
    dragging=true;startX=event.clientX;startY=event.clientY;startLeft=viewport.scrollLeft;startTop=viewport.scrollTop;
    viewport.classList.add('dragging');viewport.setPointerCapture(event.pointerId);
  });
  viewport.addEventListener('pointermove',event=>{if(dragging){viewport.scrollLeft=startLeft-(event.clientX-startX);viewport.scrollTop=startTop-(event.clientY-startY);}});
  const stop=event=>{if(!dragging)return;dragging=false;viewport.classList.remove('dragging');try{viewport.releasePointerCapture(event.pointerId);}catch(_){}};
  viewport.addEventListener('pointerup',stop);viewport.addEventListener('pointercancel',stop);
  root.querySelectorAll('[data-relation-zoom]').forEach(button=>button.addEventListener('click',()=>{
    const action=button.dataset.relationZoom;
    if(action==='in')apply(scale*1.2);else if(action==='out')apply(scale/1.2);else apply(1);
  }));
  apply(1);
}

function isEscapeKey(event){return event?.key==='Escape'||event?.key==='Esc'||event?.code==='Escape';}
function clearSelectionOnEscape(){
  // Card multi-selection is the explicit UI mode, so Escape must leave it in
  // one keypress even if WebKit happens to retain an unrelated text range.
  if(ui.page==='lightnovels'&&ui.lnSelection?.size){clearLnSelection();return true;}
  if(ui.page==='manga'&&(window.PudgeMangaReaderV2?.selectedBookIds?.().length||0)){window.PudgeMangaReaderV2.clearSelection?.();return true;}
  if(ui.page==='audiobooks'&&(window.PudgeAudiobookSelection?.selectedBookIds?.().length||0)){window.PudgeAudiobookSelection.clearSelection?.();return true;}
  const nativeSelection=window.getSelection?.();
  if(nativeSelection&&!nativeSelection.isCollapsed){nativeSelection.removeAllRanges();$('lnStudyPop')?.classList.remove('open');$('lnTranslatePop')?.classList.remove('open');return true;}
  return false;
}
function captureEscapeCardSelection(event){
  if(!isEscapeKey(event))return;
  // Window-capture runs before document/modal/search handlers and also accepts
  // WebKit's occasional `Esc` key spelling.  This makes Escape deterministic
  // for card selection instead of depending on which child currently has focus.
  const hasCards=(ui.page==='lightnovels'&&!!ui.lnSelection?.size)
    ||(ui.page==='manga'&&!!(window.PudgeMangaReaderV2?.selectedBookIds?.().length||0))
    ||(ui.page==='audiobooks'&&!!(window.PudgeAudiobookSelection?.selectedBookIds?.().length||0));
  if(!hasCards)return;
  if(clearSelectionOnEscape()){event.preventDefault();event.stopImmediatePropagation();}
}
window.addEventListener('keydown',captureEscapeCardSelection,true);
window.addEventListener('keyup',captureEscapeCardSelection,true);
async function handleEscape(event){
  if(!isEscapeKey(event))return;
  event.preventDefault();
  event.stopImmediatePropagation();
  if($('onboardingBackdrop').classList.contains('open')){
    if(ui.onboardingForced)closeOnboarding();else await skipOnboarding();
    return;
  }
  if($('modalBackdrop').classList.contains('open')){closeModal();return;}
  if($('contextMenu').classList.contains('open')){hideContextMenu();return;}
  if(clearSelectionOnEscape())return;
  if(ui.state?.settings?.escape_exits_fullscreen!==false){
    try{await pywebview.api.exit_fullscreen();}catch(error){console.error(error);}
  }
}

async function focusDroppedImport(result){
  const focus=result?.focus;if(!focus)return;
  const page=String(focus.page||'current');
  const canInject=Boolean(focus.book&&(page==='lightnovels'||page==='manga'));
  // A Finder drop already carries the imported card. Do not simultaneously
  // fetch/serialize the entire literature library while injecting that card.
  if(canInject&&ui.page!==page)ui.skipActivatedPageLoadOnce=true;
  setPage(page);
  if(page==='current'){ui.state=await pywebview.api.get_state();renderDataPages();}
  else if(page==='lightnovels'){
    if(focus.book){injectLnBook(focus.book);updateCount();setTimeout(scheduleLnStatePoll,2500);}
    else await loadLightNovels(true);
  }
  else if(page==='manga'){if(focus.book)await window.PudgeMangaReaderV2?.injectBook?.(focus.book);else await window.PudgeMangaReaderV2?.renderLibrary?.();}
  else if(page==='audiobooks'){await window.PudgeMedia?.loadAudio?.();}
  let selector='';
  if(focus.kind==='light_novel')selector=`[data-ln-book="${Number(focus.id)}"]`;
  else if(focus.kind==='manga')selector=`[data-manga-book="${Number(focus.id)}"]`;
  else if(focus.kind==='audiobook')selector=`[data-audiobook-id="${Number(focus.id)}"]`;
  else if(focus.kind==='anime'&&focus.media_id)selector=`[data-media-id="${Number(focus.media_id)}"]`;
  if(!selector&&!(focus.kind==='anime'&&focus.video_path))return;
  for(let attempt=0;attempt<12;attempt++){
    const node=selector?document.querySelector(selector):[...document.querySelectorAll('[data-path]')].find(item=>String(item.dataset.path||'')===String(focus.video_path));
    if(node){node.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'});node.classList.add('drop-focus');setTimeout(()=>node.classList.remove('drop-focus'),1700);return;}
    await new Promise(resolve=>setTimeout(resolve,100));
  }
}

let globalSearchRows=[],globalSearchTimer=null,globalSearchRequest=0;

function ensureGlobalSearchOverlay(){
  let overlay=$('globalSearchOverlay');
  if(overlay)return overlay;
  overlay=document.createElement('div');
  overlay.id='globalSearchOverlay';
  overlay.hidden=true;
  overlay.style.cssText='position:fixed;inset:0;z-index:10120;background:rgba(2,7,13,.72);backdrop-filter:blur(9px);display:grid;place-items:start center;padding-top:min(15vh,120px)';
  overlay.innerHTML=`<div class="pudge-search-surface" style="width:min(720px,calc(100vw - 36px));max-height:min(72vh,720px);display:flex;flex-direction:column">
    <input id="globalSearchInput" class="pudge-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="${ui.lang==='ru'?'Поиск по Pudge…':'Search Pudge…'}">
    <div id="globalSearchResults" class="pudge-search-results"></div>
  </div>`;
  document.body.appendChild(overlay);

  const input=$('globalSearchInput');
  input.addEventListener('input',()=>{
    if(globalSearchTimer)clearTimeout(globalSearchTimer);
    globalSearchTimer=setTimeout(()=>void runGlobalSearch(input.value),180);
  });
  input.addEventListener('keydown',event=>{
    if(event.key==='Escape'){event.preventDefault();closeGlobalSearch();return;}
    if(event.key==='Enter'){
      const first=$('globalSearchResults')?.querySelector('[data-global-open-index]');
      if(first){event.preventDefault();first.click();}
    }
  });
  overlay.addEventListener('pointerdown',event=>{
    if(event.target===overlay)closeGlobalSearch();
  });
  overlay.addEventListener('click',async event=>{
    const play=event.target.closest?.('[data-global-play-index]');
    const open=event.target.closest?.('[data-global-open-index]');
    if(!play&&!open)return;
    event.preventDefault();event.stopPropagation();
    const index=Number((play||open).dataset[play?'globalPlayIndex':'globalOpenIndex']);
    const item=globalSearchRows[index];
    if(!item)return;
    if(play){
      closeGlobalSearch();
      await startPlay(String(item.video_path||''),true);
      return;
    }
    await openGlobalSearchResult(item);
  });
  return overlay;
}

function globalSearchKindLabel(item){
  if(item.kind==='episode')return ui.lang==='ru'?`Аниме · серия ${item.episode}`:`Anime · episode ${item.episode}`;
  if(item.kind==='anime')return ui.lang==='ru'?'Аниме':'Anime';
  if(item.kind==='light_novel')return ui.lang==='ru'?'Ранобэ':'Light Novel';
  if(item.kind==='manga')return ui.lang==='ru'?'Манга':'Manga';
  if(item.kind==='audiobook')return ui.lang==='ru'?'Аудиокнига':'Audiobook';
  return String(item.kind||'');
}

function renderGlobalSearchResults(rows,query=''){
  globalSearchRows=Array.isArray(rows)?rows:[];
  const root=$('globalSearchResults');if(!root)return;
  if(!globalSearchRows.length){
    root.innerHTML=`<div class="subtle" style="padding:18px 10px;text-align:center">${query?(ui.lang==='ru'?'Ничего не найдено':'Nothing found'):(ui.lang==='ru'?'Начните вводить название':'Type a title')}</div>`;
    return;
  }
  root.innerHTML=globalSearchRows.map((item,index)=>{
    const cover=item.cover?`<img src="${escapeHtml(item.cover)}" alt="" style="width:42px;height:58px;object-fit:cover;border-radius:5px;background:#20334f">`:`<div style="width:42px;height:58px;border-radius:5px;background:#20334f"></div>`;
    const matched=item.matched_title&&String(item.matched_title)!==String(item.title)?`<div class="subtle" style="font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${ui.lang==='ru'?'Совпало: ':'Matched: '}${escapeHtml(item.matched_title)}</div>`:'';
    const volume=item.volume?` · ${ui.lang==='ru'?'том':'vol.'} ${escapeHtml(item.volume)}`:'';
    const play=item.video_path?`<button data-global-play-index="${index}" title="${ui.lang==='ru'?'Продолжить / открыть':'Resume / open'}" style="align-self:center">▶</button>`:'';
    return `<div data-global-open-index="${index}" style="display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px;border-radius:9px;cursor:pointer">

    </div>`;
  }).join('');
}

function globalSearchIdentity(value){
  return String(value||'').normalize('NFKC').toLocaleLowerCase().replace(/[\s\p{P}\p{Z}]+/gu,'').trim();
}

function mergeGlobalAniListSuggestions(localRows,suggestions){
  const rows=Array.isArray(localRows)?[...localRows]:[];
  const ids=new Set(rows.map(item=>Number(item?.media_id||0)).filter(Boolean));
  const titles=new Set(rows.map(item=>globalSearchIdentity(item?.title)).filter(Boolean));
  let added=0;
  for(const suggestion of (Array.isArray(suggestions)?suggestions:[])){
    const mediaId=Number(suggestion?.media_id||0),title=String(suggestion?.title||'').trim(),titleKey=globalSearchIdentity(title);
    if((mediaId&&ids.has(mediaId))||(titleKey&&titles.has(titleKey)))continue;
    const mediaKind=String(suggestion?.media_kind||'anime').toLowerCase();
    rows.push({kind:mediaKind==='novel'?'light_novel':mediaKind==='manga'?'manga':'anime',media_id:mediaId||null,title:title||'AniList',matched_title:title,cover:String(suggestion?.cover||''),site_url:String(suggestion?.site_url||''),page:'remote',remote:true,score:Number(suggestion?.mean_score||0),priority_tier:3});
    if(mediaId)ids.add(mediaId);if(titleKey)titles.add(titleKey);
    added++;if(added>=5)break;
  }
  return rows;
}

async function runGlobalSearch(query){
  const cleaned=String(query||'').trim(),request=++globalSearchRequest;
  if(!cleaned){renderGlobalSearchResults([],'');return;}
  const root=$('globalSearchResults');
  if(root)root.innerHTML=`<div class="subtle" style="padding:18px 10px;text-align:center">${ui.lang==='ru'?'Ищу…':'Searching…'}</div>`;
  try{
    const localRows=await pywebview.api.global_media_search(cleaned,40);
    if(request!==globalSearchRequest)return;
    renderGlobalSearchResults(localRows,cleaned);
    try{
      const suggestions=await pywebview.api.planning_search_anilist(cleaned);
      if(request!==globalSearchRequest)return;
      const merged=mergeGlobalAniListSuggestions(localRows,suggestions);
      if(merged.length!==(Array.isArray(localRows)?localRows.length:0))renderGlobalSearchResults(merged,cleaned);
    }catch(_error){}
  }catch(error){
    if(request!==globalSearchRequest)return;
    if(root)root.innerHTML=`<div class="subtle" style="padding:18px 10px;text-align:center">${escapeHtml(error.message||error)}</div>`;
  }
}

function openGlobalSearch(){
  const overlay=ensureGlobalSearchOverlay();
  overlay.hidden=false;
  overlay.style.display='grid';
  const input=$('globalSearchInput');
  input.placeholder=ui.lang==='ru'?'Поиск по Pudge…':'Search Pudge…';
  requestAnimationFrame(()=>{input.focus();input.select();});
  if(input.value.trim())void runGlobalSearch(input.value);else renderGlobalSearchResults([],'');
}

function closeGlobalSearch(){
  const overlay=$('globalSearchOverlay');if(!overlay)return;
  overlay.hidden=true;overlay.style.display='none';
  globalSearchRequest++;
}

async function openGlobalSearchResult(item){
  if(item.remote){
    closeGlobalSearch();
    if(item.site_url)await pywebview.api.open_url(String(item.site_url));
    return;
  }
  if(item.kind==='episode'){
    closeGlobalSearch();
    await startPlay(String(item.video_path||''),true);
    return;
  }
  if(item.kind==='light_novel'){
    closeGlobalSearch();
    setPage('lightnovels');
    await openLightNovel(Number(item.local_id));
    return;
  }
  if(item.kind==='manga'){
    closeGlobalSearch();
    setPage('manga');
    await window.PudgeMangaReaderV2?.renderLibrary?.();
    await window.PudgeMangaReaderV2?.openBook?.(Number(item.local_id));
    return;
  }
  if(item.kind==='audiobook'){
    closeGlobalSearch();
    setPage('audiobooks');
    await globalThis.PudgeMedia?.loadAudio?.();
    requestAnimationFrame(()=>document.querySelector(`[data-audiobook-id="${Number(item.local_id)}"]`)?.scrollIntoView({block:'center'}));
    return;
  }
  if(item.kind==='anime'){
    closeGlobalSearch();
    if(item.page==='planned'){
      setPage('planned');
      const search=$('plannedSearch');
      if(search){search.value=item.title||'';search.dispatchEvent(new Event('input',{bubbles:true}));}
      return;
    }
    setPage('current');
    requestAnimationFrame(()=>{
      const card=$('currentContent')?.querySelector(`[data-media-id="${Number(item.media_id)}"]`);
      if(card){card.scrollIntoView({block:'center'});card.classList.add('drop-focus');}
      else if(item.site_url)void pywebview.api.open_url(item.site_url);
    });
  }
}

function credentialCheckMessage(check){
  const service=String(check?.service||'API'),status=String(check?.status||'');
  if(status==='ok')return `✓ ${service}: ${ui.lang==='ru'?'ключ работает':'key works'}`;
  if(status==='empty')return `⚠ ${service}: ${ui.lang==='ru'?'тестовый запрос ничего не вернул — возможно, ключ некорректный или доступ ограничен':'test request returned nothing — the key may be invalid or access may be limited'}`;
  if(status==='invalid')return `⚠ ${service}: ${ui.lang==='ru'?'ключ отклонён сервисом':'key was rejected by the service'}`;
  if(status==='missing')return `${service}: ${ui.lang==='ru'?'ключ удалён':'key removed'}`;
  if(status==='rate_limited')return `⚠ ${service}: ${ui.lang==='ru'?'проверка отложена из-за rate limit':'validation was blocked by rate limiting'}`;
  if(status==='unreachable')return `⚠ ${service}: ${ui.lang==='ru'?'не удалось проверить из-за сети':'could not be checked because of a network error'}`;
  return `⚠ ${service}: ${ui.lang==='ru'?'не удалось проверить ключ':'could not validate the key'}`;
}

    if(target.dataset.glossaryDelete!=null){const rows=await pywebview.api.delete_character_glossary_override(Number(ui.glossaryMediaId),target.dataset.glossaryDelete);renderCharacterGlossary(rows);return;}
  }catch(error){toast(t('error.generic',{error:error.message||error}));}
})()});

document.addEventListener('pointerdown',e=>{if(!e.target.closest('#lnStudyPop')&&!e.target.closest('[data-ln-token]'))$('lnStudyPop')?.classList.remove('open');if(!e.target.closest('#lnTranslatePop')&&!e.target.closest('#lnReader'))hideLnTranslation();if(!e.target.closest('#lnReaderAppearance')&&!e.target.closest('#lnReaderAppearanceToggle'))$('lnReaderAppearance')?.classList.remove('open');});

</script>
